<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classbound Delve</title>
    <meta name="theme-color" content="#121417" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Classbound" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
    <style>
:root {
  color-scheme: dark;
  --ink: #f6f1e8;
  --muted: #afa89e;
  --panel: rgba(22, 25, 29, 0.92);
  --line: rgba(255, 255, 255, 0.14);
  --red: #d95757;
  --gold: #f2b85b;
  --green: #5ec28c;
  --blue: #73a9ff;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: #121417;
  color: var(--ink);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

#app {
  position: relative;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
}

#game {
  display: block;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  background: #17191c;
  image-rendering: crisp-edges;
  touch-action: none;
  user-select: none;
}

.overlay {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: grid;
  place-items: center;
  padding: 24px;
  background: rgba(10, 12, 15, 0.5);
  backdrop-filter: blur(5px);
}

.hidden {
  display: none;
}

.panel {
  width: min(960px, 100%);
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.44);
}

.menu-panel,
.settings-panel,
.end-panel {
  padding: 28px;
}

.settings-panel {
  max-height: min(760px, calc(100vh - 48px));
  overflow-y: auto;
  scrollbar-color: rgba(242, 184, 91, 0.7) rgba(255, 255, 255, 0.08);
}

.eyebrow {
  margin: 0 0 8px;
  color: var(--gold);
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0;
  text-transform: uppercase;
}

h1,
h2,
h3,
p {
  margin-top: 0;
}

h1 {
  margin-bottom: 20px;
  font-size: clamp(2.2rem, 6vw, 4.4rem);
  line-height: 0.96;
}

h2 {
  margin-bottom: 8px;
}

.character-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.character-card {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 18px;
  background: rgba(255, 255, 255, 0.05);
  cursor: pointer;
  transition: border-color 120ms ease, background 120ms ease;
}

.character-card.selected {
  border-color: var(--gold);
  background: rgba(242, 184, 91, 0.13);
}

.character-art {
  width: 100%;
  height: 132px;
  margin-bottom: 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #101317;
}

.stat-line {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 0.88rem;
}

.tag {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 8px;
  color: var(--ink);
  background: rgba(255, 255, 255, 0.06);
}

.lobby-preview {
  position: relative;
  height: 220px;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  background:
    linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
    #181b1e;
  background-size: 48px 48px;
}

.lobby-preview::before {
  content: "";
  position: absolute;
  inset: 18px;
  border: 5px solid rgba(242, 184, 91, 0.58);
  border-radius: 8px;
}

.lobby-preview::after {
  content: "";
  position: absolute;
  left: 11%;
  right: 11%;
  bottom: 28px;
  height: 22px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.28);
}

.lobby-figure,
.lobby-gate,
.lobby-spot {
  position: absolute;
  z-index: 1;
}

.lobby-figure {
  width: 44px;
  height: 44px;
  border: 4px solid #101317;
  border-radius: 50%;
  box-shadow: 0 14px 0 rgba(0, 0, 0, 0.22);
}

.lobby-figure::after {
  content: "";
  position: absolute;
  right: -16px;
  top: 14px;
  width: 28px;
  height: 8px;
  border-radius: 999px;
  background: currentColor;
}

.lobby-figure.mannequin {
  left: 46%;
  top: 92px;
  color: #afa89e;
  background: #f6f1e8;
}

.lobby-figure.swordsman {
  left: 29%;
  top: 68px;
  color: #f2b85b;
  background: #d95757;
}

.lobby-figure.archer {
  right: 29%;
  top: 68px;
  color: #73a9ff;
  background: #5ec28c;
}

.lobby-gate {
  left: 50%;
  bottom: 30px;
  width: 58px;
  height: 76px;
  border: 6px solid #73a9ff;
  border-radius: 50%;
  transform: translateX(-50%);
  background: rgba(115, 169, 255, 0.18);
  box-shadow: inset 0 0 24px rgba(115, 169, 255, 0.36);
}

.lobby-spot {
  left: 16%;
  bottom: 54px;
  width: 72px;
  height: 34px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.06);
}

.menu-actions,
.settings-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 18px;
}

.settings-tabs {
  display: flex;
  flex-wrap: wrap;
  position: relative;
  z-index: 1;
  gap: 8px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
}

.tab-button {
  min-height: 36px;
  padding: 0 14px;
  touch-action: manipulation;
}

.tab-button.active {
  border-color: rgba(242, 184, 91, 0.8);
  background: rgba(242, 184, 91, 0.16);
}

button {
  min-height: 40px;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 0 16px;
  color: var(--ink);
  background: rgba(255, 255, 255, 0.08);
  font: inherit;
  font-weight: 800;
  cursor: pointer;
}

button:hover {
  border-color: rgba(255, 255, 255, 0.38);
}

input {
  min-height: 40px;
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 0 12px;
  color: var(--ink);
  background: rgba(255, 255, 255, 0.07);
  font: inherit;
}

input:focus {
  outline: 2px solid rgba(242, 184, 91, 0.38);
  outline-offset: 1px;
}

.primary {
  border-color: rgba(242, 184, 91, 0.8);
  background: #b56b34;
}

.secondary {
  background: rgba(255, 255, 255, 0.08);
}

.icon-button {
  width: 40px;
  min-width: 40px;
  padding: 0;
}

.panel-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}

.keybind-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.keybind-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px 12px;
  background: rgba(255, 255, 255, 0.04);
}

.keybind-row span {
  color: var(--muted);
}

.keybind-row button {
  min-width: 120px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

.secret-code-form,
.coin-prompt {
  display: grid;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
  background: rgba(255, 255, 255, 0.04);
}

.coin-prompt {
  margin-top: 12px;
}

.settings-section.hidden,
.coin-prompt.hidden {
  display: none;
}

.secret-code-form label,
.coin-prompt label {
  color: var(--muted);
  font-weight: 800;
}

.input-row {
  display: flex;
  gap: 10px;
}

.input-row button {
  flex: 0 0 auto;
}

.secret-code-message {
  min-height: 20px;
  margin: 0;
  color: var(--gold);
  font-weight: 800;
}

.upgrades-layout {
  display: grid;
  grid-template-columns: minmax(280px, 0.95fr) minmax(260px, 1.05fr);
  gap: 14px;
  min-height: 360px;
}

.upgrade-list {
  display: grid;
  align-content: start;
  gap: 8px;
  max-height: min(520px, 58vh);
  overflow-y: auto;
  padding-right: 4px;
  scrollbar-color: rgba(242, 184, 91, 0.7) rgba(255, 255, 255, 0.08);
}

.upgrade-group {
  margin: 8px 0 2px;
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 900;
  text-transform: uppercase;
}

.upgrade-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  min-height: 58px;
  border-color: var(--rarity-color);
  padding: 8px 10px;
  text-align: left;
  background: rgba(255, 255, 255, 0.045);
}

.upgrade-row.selected {
  background: rgba(255, 255, 255, 0.09);
  box-shadow: inset 3px 0 0 var(--rarity-color);
}

.upgrade-row-main {
  min-width: 0;
}

.upgrade-name,
.upgrade-meta,
.upgrade-count {
  display: block;
}

.upgrade-name {
  overflow: hidden;
  color: var(--ink);
  font-weight: 900;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.upgrade-meta {
  margin-top: 3px;
  color: var(--rarity-color);
  font-size: 0.72rem;
  font-weight: 900;
}

.upgrade-count {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 8px;
  color: var(--ink);
  background: rgba(0, 0, 0, 0.24);
  font-size: 0.78rem;
}

.upgrade-detail {
  min-height: 260px;
  border: 1px solid var(--rarity-color, var(--line));
  border-radius: 8px;
  padding: 16px;
  background: rgba(255, 255, 255, 0.045);
}

.upgrade-detail h3 {
  margin-bottom: 8px;
  color: var(--rarity-color, var(--ink));
}

.upgrade-detail-meta {
  color: var(--muted);
  font-weight: 900;
}

.upgrade-detail-description {
  color: var(--ink);
  line-height: 1.45;
}

.upgrade-empty {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.04);
}

.item-list {
  display: grid;
  gap: 8px;
}

.item-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  min-height: 58px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  background: rgba(255, 255, 255, 0.045);
}

.item-name,
.item-description,
.item-value {
  display: block;
}

.item-name {
  font-weight: 900;
}

.item-description {
  margin-top: 3px;
  color: var(--muted);
  font-size: 0.82rem;
}

.item-value {
  flex: 0 0 auto;
  min-width: 76px;
  border: 1px solid rgba(242, 184, 91, 0.5);
  border-radius: 999px;
  padding: 5px 10px;
  color: var(--gold);
  background: rgba(0, 0, 0, 0.22);
  text-align: center;
  font-weight: 900;
}

.touch-controls {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  touch-action: none;
}

.touch-stick {
  position: absolute;
  left: max(18px, env(safe-area-inset-left));
  bottom: max(22px, env(safe-area-inset-bottom));
  width: 128px;
  height: 128px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 50%;
  background: rgba(10, 12, 15, 0.48);
  box-shadow: inset 0 0 0 10px rgba(255, 255, 255, 0.04);
  pointer-events: auto;
}

.touch-stick-knob {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 58px;
  height: 58px;
  border: 1px solid rgba(242, 184, 91, 0.68);
  border-radius: 50%;
  background: rgba(181, 107, 52, 0.78);
  transform: translate(-50%, -50%);
}

.touch-actions {
  position: absolute;
  right: max(16px, env(safe-area-inset-right));
  bottom: max(20px, env(safe-area-inset-bottom));
  display: grid;
  grid-template-columns: repeat(3, 58px);
  grid-template-rows: repeat(2, 58px);
  gap: 9px;
  pointer-events: auto;
}

.touch-button,
.touch-settings {
  min-height: 0;
  padding: 0;
  border-radius: 50%;
  background: rgba(10, 12, 15, 0.7);
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.28);
  font-size: 0.7rem;
  letter-spacing: 0;
  touch-action: none;
}

.touch-button {
  width: 58px;
  height: 58px;
}

.touch-button.primary-action {
  grid-column: 3;
  grid-row: 1 / span 2;
  width: 72px;
  height: 72px;
  align-self: center;
  border-color: rgba(242, 184, 91, 0.86);
  background: rgba(181, 107, 52, 0.86);
}

.touch-settings {
  position: absolute;
  right: max(14px, env(safe-area-inset-right));
  top: max(14px, env(safe-area-inset-top));
  width: 48px;
  height: 48px;
  pointer-events: auto;
}

@media (max-width: 780px) {
  .character-grid,
  .keybind-list {
    grid-template-columns: 1fr;
  }

  .input-row {
    flex-direction: column;
  }

  .upgrades-layout {
    grid-template-columns: 1fr;
  }

  .upgrade-list {
    max-height: 34vh;
  }

  .menu-panel,
  .settings-panel,
  .end-panel {
    padding: 18px;
  }

  .overlay {
    padding: 14px;
  }

  .menu-actions,
  .settings-actions {
    flex-direction: column;
  }

  .menu-actions button,
  .settings-actions button {
    width: 100%;
  }

  .settings-tabs {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .tab-button {
    width: 100%;
    min-width: 0;
  }

  .item-row {
    align-items: flex-start;
    flex-direction: column;
  }

  .item-value {
    min-width: 0;
  }

  .lobby-preview {
    height: min(190px, 34vh);
  }

  .settings-panel {
    max-height: calc(100dvh - 28px);
  }
}

@media (hover: hover) and (pointer: fine) {
  .touch-controls {
    display: none;
  }
}

@media (max-width: 430px) {
  .touch-stick {
    width: 112px;
    height: 112px;
  }

  .touch-stick-knob {
    width: 52px;
    height: 52px;
  }

  .touch-actions {
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(2, 52px);
    gap: 8px;
  }

  .touch-button {
    width: 52px;
    height: 52px;
    font-size: 0.63rem;
  }

  .touch-button.primary-action {
    width: 66px;
    height: 66px;
  }
}

    </style>
  </head>
  <body>
    <main id="app">
      <canvas id="game" width="1280" height="720" aria-label="Dungeon game canvas"></canvas>

      <div id="touchControls" class="touch-controls hidden" aria-label="Touch controls">
        <button class="touch-settings" type="button" data-touch-action="settings" aria-label="Settings">SET</button>
        <div id="touchStick" class="touch-stick" aria-label="Move">
          <div id="touchStickKnob" class="touch-stick-knob"></div>
        </div>
        <div class="touch-actions" aria-label="Actions">
          <button class="touch-button secondary-action" type="button" data-touch-action="interact">USE</button>
          <button class="touch-button secondary-action" type="button" data-touch-action="dash">DASH</button>
          <button class="touch-button primary-action" type="button" data-touch-action="autoAimAttack">ATK</button>
          <button class="touch-button secondary-action" type="button" data-touch-action="ability">ULT</button>
          <button class="touch-button secondary-action" type="button" data-touch-action="extraAbility">EVO</button>
        </div>
      </div>

      <section id="menu" class="overlay">
        <div class="panel menu-panel">
          <p class="eyebrow">Desktop dungeon prototype</p>
          <h1>Classbound Delve</h1>
          <div class="lobby-preview" aria-hidden="true">
            <div class="lobby-figure mannequin"></div>
            <div class="lobby-figure swordsman"></div>
            <div class="lobby-gate"></div>
            <div class="lobby-figure archer"></div>
            <div class="lobby-spot"></div>
          </div>
          <div class="menu-actions">
            <button id="startGame" class="primary">Enter Lobby 1P</button>
            <button id="startCoop" class="primary">Enter Lobby 2P</button>
            <button id="openSettings" class="secondary">Settings</button>
          </div>
        </div>
      </section>

      <section id="settings" class="overlay hidden">
        <div class="panel settings-panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Run Menu</p>
              <h2>Settings</h2>
            </div>
            <button id="closeSettings" class="icon-button" title="Close settings">X</button>
          </div>

          <div class="settings-tabs" role="tablist" aria-label="Settings sections">
            <button id="controlsTab" class="tab-button active" type="button">Controls</button>
            <button id="upgradesTab" class="tab-button" type="button">Upgrades</button>
            <button id="itemsTab" class="tab-button" type="button">Items</button>
            <button id="secretCodesTab" class="tab-button" type="button">Secret Codes</button>
          </div>

          <div id="controlsPanel" class="settings-section">
            <div id="keybindRows" class="keybind-list"></div>
            <div class="settings-actions">
              <button id="resetKeybinds" class="secondary">Reset Defaults</button>
              <button id="saveSettings" class="primary">Save</button>
            </div>
          </div>

          <div id="upgradesPanel" class="settings-section hidden">
            <div class="upgrades-layout">
              <div>
                <div id="upgradeRows" class="upgrade-list"></div>
              </div>
              <aside id="upgradeDetail" class="upgrade-detail">
                <p class="eyebrow">Upgrade Details</p>
                <h3 id="upgradeDetailName">No upgrade selected</h3>
                <p id="upgradeDetailMeta" class="upgrade-detail-meta"></p>
                <p id="upgradeDetailDescription" class="upgrade-detail-description">Click an upgrade to read what it does.</p>
              </aside>
            </div>
          </div>

          <div id="itemsPanel" class="settings-section hidden">
            <div id="itemRows" class="item-list"></div>
          </div>

          <div id="secretCodesPanel" class="settings-section hidden">
            <form id="secretCodeForm" class="secret-code-form">
              <label for="secretCodeInput">Secret code</label>
              <div class="input-row">
                <input id="secretCodeInput" type="text" autocomplete="off" spellcheck="false" />
                <button id="submitSecretCode" class="primary" type="submit">Submit</button>
              </div>
              <p id="secretCodeMessage" class="secret-code-message"></p>
            </form>

            <form id="coinPrompt" class="coin-prompt hidden">
              <label for="coinAmountInput">How many coins?</label>
              <div class="input-row">
                <input id="coinAmountInput" type="number" min="0" step="1" />
                <button id="grantCoins" class="primary" type="submit">Grant</button>
                <button id="cancelCoins" class="secondary" type="button">Cancel</button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <section id="gameOver" class="overlay hidden">
        <div class="panel end-panel">
          <p class="eyebrow">Run ended</p>
          <h2 id="gameOverTitle">Defeated</h2>
          <p id="gameOverStats"></p>
          <button id="restartGame" class="primary">Back to Lobby Entrance</button>
        </div>
      </section>
    </main>
    <script>

// src/utils/math.js
function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function normalize(x, y) {
  const length = Math.hypot(x, y);
  if (length === 0) {
    return { x: 0, y: 0 };
  }
  return { x: x / length, y: y / length };
}

function angleTo(a, b) {
  return Math.atan2(b.y - a.y, b.x - a.x);
}

function randomRange(min, max) {
  return min + Math.random() * (max - min);
}

function circleHit(a, b) {
  return distance(a, b) <= a.radius + b.radius;
}

function rectCircleHit(rect, circle) {
  const nearestX = clamp(circle.x, rect.x, rect.x + rect.w);
  const nearestY = clamp(circle.y, rect.y, rect.y + rect.h);
  return Math.hypot(circle.x - nearestX, circle.y - nearestY) <= circle.radius;
}

function pushCircleOutOfRect(circle, rect) {
  if (!rectCircleHit(rect, circle)) {
    return;
  }

  const nearestX = clamp(circle.x, rect.x, rect.x + rect.w);
  const nearestY = clamp(circle.y, rect.y, rect.y + rect.h);
  const dx = circle.x - nearestX;
  const dy = circle.y - nearestY;
  const dist = Math.hypot(dx, dy);

  if (dist > 0) {
    const overlap = circle.radius - dist;
    circle.x += (dx / dist) * overlap;
    circle.y += (dy / dist) * overlap;
    return;
  }

  const left = circle.x - rect.x;
  const right = rect.x + rect.w - circle.x;
  const top = circle.y - rect.y;
  const bottom = rect.y + rect.h - circle.y;
  const smallest = Math.min(left, right, top, bottom);

  if (smallest === left) {
    circle.x = rect.x - circle.radius;
  } else if (smallest === right) {
    circle.x = rect.x + rect.w + circle.radius;
  } else if (smallest === top) {
    circle.y = rect.y - circle.radius;
  } else {
    circle.y = rect.y + rect.h + circle.radius;
  }
}

function weaponMatchesClass(weapon, classId) {
  return weapon.classes.includes(classId);
}

function formatWeaponClasses(weapon) {
  if (weapon.classes.includes(CLASS_IDS.NEUTRAL)) {
    return "Neutral";
  }
  return weapon.classes.map((classId) => classId[0].toUpperCase() + classId.slice(1)).join(" / ");
}

function weaponStats(weapon, player = null) {
  if (!weapon) {
    return "No weapon loaded";
  }

  const stats = [];
  if (weapon.kind === "nuke") {
    stats.push(`DMG ${weapon.damage}`);
  } else if (player) {
    stats.push(`Base DMG ${player.baseDamage}`);
  }

  const damageBonus = (weapon.damageBonus ?? 0) + (player?.weaponEvolution?.damageBonus ?? 0) + (player?.statBonuses?.attackDamage ?? 0);
  if (damageBonus > 0) {
    stats.push(`DMG +${Math.round(damageBonus * 100)}%`);
  }

  stats.push(`CD ${weapon.cooldown}s`);

  if (weapon.kind === "nuke") {
    stats.push("Room clear");
  } else if (weapon.kind === "melee") {
    stats.push(`Range ${weapon.range}`);
  } else {
    stats.push(`Shots ${weapon.projectileCount ?? 1}`);
    stats.push(`Speed ${weapon.projectileSpeed}`);
  }

  if (weapon.slow) {
    stats.push(`Slow ${weapon.slow}s`);
  }

  return stats.join("  ");
}

function weaponUpgradeBlueprintFor(player) {
  return weaponUpgradeBlueprints[player.character?.classId] ?? weaponUpgradeBlueprints.default;
}

function weaponUpgradeRequirementLine(player) {
  const blueprint = weaponUpgradeBlueprintFor(player);
  const req = blueprint.requirements;
  return `${player.materials.weapon}/${req.weapon} Ore  ${player.materials.weaponCore}/${req.weaponCore} Core  ${player.gold}/${req.gold} coins`;
}

function canCompleteWeaponUpgrade(player) {
  if (!player.blueprints.weaponEvolution || player.weaponEvolution.completed) {
    return false;
  }
  const req = weaponUpgradeBlueprintFor(player).requirements;
  return player.materials.weapon >= req.weapon && player.materials.weaponCore >= req.weaponCore && player.gold >= req.gold;
}

function completeWeaponUpgrade(player) {
  if (!canCompleteWeaponUpgrade(player)) {
    return null;
  }
  const blueprint = weaponUpgradeBlueprintFor(player);
  const req = blueprint.requirements;
  player.materials.weapon -= req.weapon;
  player.materials.weaponCore -= req.weaponCore;
  player.gold -= req.gold;
  player.weaponEvolution.damageBonus += blueprint.damageBonus;
  player.weaponEvolution.completed = true;
  player.weaponEvolution.blueprintId = blueprint.id;
  return blueprint;
}

  });
}

function addEpicEgg(player) {
  const maxEggs = player.rewardCount("epicEgg") >= 5 && !player.passives.has("fairyHatched") ? 5 : 6;
  if (player.rewardCount("epicEgg") >= maxEggs) {
    return;
  }
  const roll = Math.random();
  const pet =
    roll < 0.01 ? { id: "mythicalFairy", name: "Mythical Fairy", color: "#f8f4ff", damage: 24, cooldownMax: 0.75, fairyAuraCooldown: 0 } :
    roll < 0.21 ? { id: "epicSnake", name: "Epic Snake", color: "#6ee76d", damage: 15, cooldownMax: 0.95, poison: { duration: 3, rate: 0.012 } } :
    roll < 0.41 ? { id: "epicBird", name: "Epic Bird", color: "#ffcf3f", damage: 14, cooldownMax: 0.85, speedPulse: true, speedPulseCooldown: 0 } :
    roll < 0.61 ? { id: "epicFish", name: "Epic Flopping Fish", color: "#42d9ff", damage: 13, cooldownMax: 1.0, slow: 1.6 } :
    roll < 0.81 ? { id: "epicTiger", name: "Epic Tiger", color: "#ff7a2f", damage: 18, cooldownMax: 1.1, bleed: { duration: 3, rate: 0.018 } } :
    { id: "epicTortoise", name: "Epic Tortoise", color: "#2fb344", damage: 12, cooldownMax: 1.25, tauntCooldown: 0 };
  if (pet.id === "mythicalFairy") {
    player.passives.add("fairyHatched");
  }
  addPet(player, pet);
}

function rollRewardOptions(player, count = 3, chestRarity = "common") {
  const weights = chestTiers[chestRarity]?.rewardWeights ?? chestTiers.common.rewardWeights;
  const options = rollOptions(player, rewardPool, count, weights);
  if (options.length === 0 || options.some((reward) => !legacyRewardIds.has(reward.id))) {
    return options;
  }

  const freshPool = filteredPool(player, rewardPool)
    .filter((reward) => !legacyRewardIds.has(reward.id) && !options.some((option) => option.id === reward.id));
  const freshReward = rollReward(freshPool, weights);
  if (freshReward) {
    options[options.length - 1] = freshReward;
  }
  return options;
}

function rewardInfoFor(id) {
  const reward = rewardPool.find((candidate) => candidate.id === id) ?? shopPool.find((candidate) => candidate.id === id);
  if (!reward) {
    return null;
  }
  return {
    id: reward.id,
    name: reward.name,
    type: reward.type,
    rarity: reward.rarity,
    description: reward.description
  };
}

function rollShopOptions(player, count = 3) {
  let stock = filteredPool(player, shopPool)
    .filter((item) => Math.random() < (item.stockChance ?? 1))
    .map((item) => withShopCost(player, item));
  if (stock.length === 0) {
    const fallback = shopPool.find((item) => item.id === "shopHealthPot");
    return fallback ? [withShopCost(player, fallback)] : [];
  }
  const maxStock = Math.max(1, count + (player.passives.has("luckyPouch") ? 1 : 0));
  if (stock.length > maxStock) {
    const always = stock.find((item) => item.id === "shopHealthPot");
    const rest = stock.filter((item) => item.id !== "shopHealthPot").sort(() => Math.random() - 0.5);
    stock = always ? [always, ...rest].slice(0, maxStock) : rest.slice(0, maxStock);
  }
  return stock;
}

function ensureGuaranteedShopStock(player, stock) {
  if (stock.some((item) => item.id === "shopHealthPot")) {
    return stock;
  }
  const healthPot = shopPool.find((item) => item.id === "shopHealthPot");
  return healthPot ? [withShopCost(player, healthPot), ...stock] : stock;
}

function rollOptions(player, pool, count, weights) {
  const options = [];
  const used = new Set();
  const available = filteredPool(player, pool);
  const maxOptions = Math.min(count, available.length);
  while (options.length < maxOptions) {
    const reward = rollReward(available.filter((candidate) => !used.has(candidate.id)), weights);
    if (!reward) {
      break;
    }
    if (!used.has(reward.id)) {
      options.push(reward);
      used.add(reward.id);
    }
  }
  return options;
}

function filteredPool(player, pool) {
  return pool.filter((reward) => {
    if (!canApplyReward(player, reward)) {
      return false;
    }
    if (reward.classId && reward.classId !== player.character.classId) {
      return false;
    }
    if (reward.requiresBlueprint && !player.blueprints[reward.requiresBlueprint]) {
      return false;
    }
    if (reward.requiresReward && !player.hasReward(reward.requiresReward)) {
      return false;
    }
    if (reward.maxCount !== undefined && player.rewardCount(reward.id) >= reward.maxCount) {
      return false;
    }
    if (reward.maxCount === undefined && ["Passive", "Ability", "Pet", "Evolution"].includes(reward.type) && player.hasReward(reward.id)) {
      return false;
    }
    if (reward.unique && player.hasReward(reward.id)) {
      return false;
    }
    return true;
  });
}

function canApplyReward(player, reward) {
  if (reward.id === "epicEgg" && player.rewardCount("epicEgg") >= 5 && !player.passives.has("fairyHatched")) {
    return false;
  }
  if (reward.requiresBlueprint && !player.blueprints[reward.requiresBlueprint]) {
    return false;
  }
  if (reward.requiresReward && !player.hasReward(reward.requiresReward)) {
    return false;
  }
  if (reward.maxCount !== undefined && player.rewardCount(reward.id) >= reward.maxCount) {
    return false;
  }
  if (reward.maxCount === undefined && ["Passive", "Ability", "Pet", "Evolution"].includes(reward.type) && player.hasReward(reward.id)) {
    return false;
  }
  if (reward.grantsExtraAbility) {
    if (player.canMannequinTransform) {
      return false;
    }
    if (player.extraAbilityId) {
      return false;
    }
  }
  return true;
}

function withShopCost(player, item) {
  const bought = player.shopPurchaseCount(item.id);
  return {
    ...item,
    cost: (item.baseCost ?? item.cost ?? 0) + bought * (item.costIncrement ?? 0)
  };
}

function rollReward(pool, weights) {
  if (pool.length === 0) {
    return null;
  }
  const total = pool.reduce((sum, reward) => sum + (weights[reward.rarity] ?? 1), 0);
  let pick = Math.random() * total;
  for (const reward of pool) {
    pick -= weights[reward.rarity] ?? 1;
    if (pick <= 0) {
      return reward;
    }
  }
  return pool[0];
}

function applyReward(player, reward) {
  if (!canApplyReward(player, reward)) {
    return false;
  }
  if (reward.apply) {
    reward.apply(player);
  }
  player.rewardHistory.push(reward.id);
  if (reward.baseCost !== undefined || reward.cost !== undefined) {
    player.shopHistory.push(reward.id);
  }
  player.lastReward = reward;
  return true;
}

function createMaze(cols, rows) {
  const maze = Array.from({ length: rows }, () => Array.from({ length: cols }, () => true));
  const stack = [{ col: 1, row: 1 }];
  maze[1][1] = false;

  while (stack.length > 0) {
    const current = stack[stack.length - 1];
    const neighbors = [
      { col: current.col + 2, row: current.row },
      { col: current.col - 2, row: current.row },
      { col: current.col, row: current.row + 2 },
      { col: current.col, row: current.row - 2 }
    ].filter((cell) => cell.col > 0 && cell.col < cols - 1 && cell.row > 0 && cell.row < rows - 1 && maze[cell.row][cell.col]);

    if (neighbors.length === 0) {
      stack.pop();
      continue;
    }

    const next = neighbors[Math.floor(Math.random() * neighbors.length)];
    maze[(current.row + next.row) / 2][(current.col + next.col) / 2] = false;
    maze[next.row][next.col] = false;
    stack.push(next);
  }

  return maze;
}

function cellCenter(col, row, cellSize, margin) {
  return {
    x: margin + col * cellSize + cellSize / 2,
    y: margin + row * cellSize + cellSize / 2
  };
}

function createObstacles(room, isBoss, stageNumber) {
  const obstacles = [];
  const count = isBoss ? 9 : 7 + Math.floor(Math.random() * 7) + Math.floor(stageNumber / 3);

  for (let i = 0; i < count; i += 1) {
    const wide = Math.random() < 0.55;
    const w = wide ? randomRange(130, 230) : randomRange(58, 96);
    const h = wide ? randomRange(52, 92) : randomRange(110, 190);
    const x = randomRange(room.margin + 100, room.width - room.margin - w - 100);
    const y = randomRange(room.margin + 80, room.height - room.margin - h - 80);

    const nearCenter = Math.abs(x - room.width / 2) < 250 && Math.abs(y - room.height / 2) < 190;
    const nearTopPortal = y < room.margin + 130 && Math.abs(x - room.width / 2) < 280;
    if (!nearCenter && !nearTopPortal) {
      obstacles.push({ x, y, w, h });
    }
  }

  return obstacles;
}

function loadSpriteImages(definitions) {
  const images = {};

  for (const [id, definition] of Object.entries(definitions)) {
    const image = new Image();
    image.src = definition.src;
    images[id] = {
      ...definition,
      image,
      loaded: false
    };
    image.addEventListener("load", () => {
      images[id].loaded = true;
    });
    image.addEventListener("error", () => {
      images[id].loaded = false;
    });
  }

  return images;
}

function loadKeybinds() {
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return { ...defaultKeybinds, ...stored };
  } catch {
    return { ...defaultKeybinds };
  }
}

function saveKeybinds(keybinds) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(keybinds));
}

function resetKeybinds() {
  saveKeybinds(defaultKeybinds);
  return { ...defaultKeybinds };
}

function codeToLabel(code) {
  const labels = {
    Space: "Space",
    ShiftLeft: "Left Shift",
    ShiftRight: "Right Shift",
    Escape: "Esc",
    ArrowUp: "Up Arrow",
    ArrowDown: "Down Arrow",
    ArrowLeft: "Left Arrow",
    ArrowRight: "Right Arrow",
    Enter: "Enter",
    Slash: "/",
    Period: ".",
    Comma: ","
  };

  if (labels[code]) {
    return labels[code];
  }

  if (code.startsWith("Key")) {
    return code.slice(3);
  }

  if (code.startsWith("Digit")) {
    return code.slice(5);
  }

  return code;
}



// src/combat.js

class CombatSystem {
  constructor() {
    this.projectiles = [];
    this.enemyProjectiles = [];
    this.slashes = [];
    this.nets = [];
    this.icePatches = [];
    this.floaters = [];
    this.speechBubbles = [];
    this.screenShake = 0;
  }

  reset() {
    this.projectiles = [];
    this.enemyProjectiles = [];
    this.slashes = [];
    this.nets = [];
    this.icePatches = [];
    this.floaters = [];
    this.speechBubbles = [];
    this.screenShake = 0;
  }

  spawnProjectile(projectile) {
    this.projectiles.push(projectile);
  }

  spawnEnemyProjectile(projectile) {
    this.enemyProjectiles.push({
      radius: 9,
      color: "#d95757",
      life: 1.4,
      ...projectile,
      faction: "enemy"
    });
  }

  spawnSlash(slash) {
    slash.hit = new Set();
    slash.totalLife = slash.life;
    this.slashes.push(slash);
  }

  spawnNet(net) {
    this.nets.push({ ...net, life: 1.1, sprung: false, caught: new Set() });
  }

  spawnIcePatch(patch) {
    this.icePatches.push(patch);
  }

  floatText(x, y, text, color = "#f6f1e8") {
    this.floaters.push({ x, y, text, color, life: 0.85, total: 0.85 });
  }

  speak(target, text, options = {}) {
    this.speechBubbles.push({
      target,
      text,
      color: options.color ?? "#f6f1e8",
      accent: options.accent ?? "#d95757",
      offsetY: options.offsetY ?? -86,
      life: options.duration ?? 1.8,
      total: options.duration ?? 1.8
    });
  }

  update(dt, enemies, players, room) {
    const livePlayers = Array.isArray(players) ? players.filter((player) => player.hp > 0) : [players].filter(Boolean);
    this.screenShake = Math.max(0, this.screenShake - dt * 28);
    this.updateProjectiles(dt, enemies, room);
    this.updateEnemyProjectiles(dt, livePlayers, room);
    this.updateSlashes(dt, enemies);
    this.updateNets(dt, enemies, room);
    this.updateIcePatches(dt, enemies);

    for (const floater of this.floaters) {
      floater.life -= dt;
      floater.y -= dt * 34;
    }
    this.floaters = this.floaters.filter((floater) => floater.life > 0);

    for (const bubble of this.speechBubbles) {
      bubble.life -= dt;
    }
    this.speechBubbles = this.speechBubbles.filter((bubble) => bubble.life > 0 && (!bubble.target || bubble.target.hp === undefined || bubble.target.hp > 0));
  }

  updateProjectiles(dt, enemies, room) {
    for (const projectile of this.projectiles) {
      projectile.life -= dt;
      projectile.x += Math.cos(projectile.angle) * projectile.speed * dt;
      projectile.y += Math.sin(projectile.angle) * projectile.speed * dt;

      for (const enemy of enemies) {
        if (enemy.hp > 0 && circleHit(projectile, enemy)) {
          this.hitEnemy(enemy, projectile.damage, projectile, 110);
          if (projectile.slow) {
            enemy.slowed = Math.max(enemy.slowed ?? 0, projectile.slow);
          }
          if (projectile.poison) {
            enemy.poisoned = {
              timer: projectile.poison.duration,
              rate: projectile.poison.rate
            };
          }
          if (projectile.bleed) {
            enemy.bleeding = {
              timer: projectile.bleed.duration,
              rate: projectile.bleed.rate
            };
          }
          if (projectile.burn) {
            enemy.burning = {
              timer: projectile.burn.duration,
              rate: projectile.burn.rate
            };
          }
          this.floatText(enemy.x, enemy.y - enemy.radius, Math.round(projectile.damage).toString(), projectile.color);
          projectile.life = 0;
          this.spawnProjectileEndPatch(projectile);
          break;
        }
      }

      if (projectile.x < room.margin || projectile.x > room.width - room.margin || projectile.y < room.margin || projectile.y > room.height - room.margin) {
        projectile.life = 0;
        this.spawnProjectileEndPatch(projectile);
      }
      for (const obstacle of room.obstacles) {
        if (rectCircleHit(obstacle, projectile)) {
          projectile.life = 0;
          this.spawnProjectileEndPatch(projectile);
        }
      }
      if (projectile.life <= 0) {
        this.spawnProjectileEndPatch(projectile);
      }
    }
    this.projectiles = this.projectiles.filter((projectile) => projectile.life > 0);
  }

  spawnProjectileEndPatch(projectile) {
    if (!projectile.icePatchOnEnd || projectile.patchSpawned) {
      return;
    }
    projectile.patchSpawned = true;
    this.spawnIcePatch({
      x: projectile.x,
      y: projectile.y,
      ...projectile.icePatchOnEnd
    });
  }

  updateEnemyProjectiles(dt, players, room) {
    for (const projectile of this.enemyProjectiles) {
      projectile.life -= dt;
      if (projectile.homing) {
        const target = nearestTarget(projectile, players);
        if (target) {
          const desired = angleTo(projectile, target);
          const delta = Math.atan2(Math.sin(desired - projectile.angle), Math.cos(desired - projectile.angle));
          projectile.angle += Math.max(-2.2 * dt, Math.min(2.2 * dt, delta));
        }
      }
      projectile.x += Math.cos(projectile.angle) * projectile.speed * dt;
      projectile.y += Math.sin(projectile.angle) * projectile.speed * dt;

      const player = players.find((candidate) => circleHit(projectile, candidate));
      if (player) {
        const hit = player.takeDamage(projectile.damage);
        projectile.life = 0;
        if (hit) {
          if (projectile.slow) {
            player.slowed = Math.max(player.slowed ?? 0, projectile.slow);
          }
          this.floatText(player.x, player.y - 46, projectile.labelOnHit ?? `-${Math.round(projectile.damage)}`, projectile.color);
          this.screenShake = Math.max(this.screenShake, 6);
        }
      }

      if (projectile.x < room.margin || projectile.x > room.width - room.margin || projectile.y < room.margin || projectile.y > room.height - room.margin) {
        projectile.life = 0;
      }
      for (const obstacle of room.obstacles) {
        if (rectCircleHit(obstacle, projectile)) {
          projectile.life = 0;
        }
      }
    }
    this.enemyProjectiles = this.enemyProjectiles.filter((projectile) => projectile.life > 0);
  }

  updateSlashes(dt, enemies) {
    for (const slash of this.slashes) {
      slash.life -= dt;
      for (const enemy of enemies) {
        if (enemy.hp <= 0 || slash.hit.has(enemy)) {
          continue;
        }
        const dist = distance(slash, enemy);
        const toEnemy = angleTo(slash, enemy);
        const delta = Math.atan2(Math.sin(toEnemy - slash.angle), Math.cos(toEnemy - slash.angle));
        const withinSwing = slash.hitAllInRange || Math.abs(delta) <= slash.arc / 2;
        if (dist <= slash.radius + enemy.radius && withinSwing) {
          slash.hit.add(enemy);
          this.hitEnemy(enemy, slash.damage, slash, slash.knockback);
          this.floatText(enemy.x, enemy.y - enemy.radius, Math.round(slash.damage).toString(), slash.hitTextColor ?? (slash.classBonus ? "#f2b85b" : "#f6f1e8"));
        }
      }
    }
    this.slashes = this.slashes.filter((slash) => slash.life > 0);
  }

  updateNets(dt, enemies, room) {
    for (const net of this.nets) {
      net.life -= dt;
      if (!net.sprung) {
        net.x += Math.cos(net.angle) * net.speed * dt;
        net.y += Math.sin(net.angle) * net.speed * dt;
        for (const enemy of enemies) {
          if (enemy.hp > 0 && circleHit(net, enemy)) {
            this.springNet(net, enemies);
            break;
          }
        }
        if (net.x < room.margin || net.x > room.width - room.margin || net.y < room.margin || net.y > room.height - room.margin) {
          this.springNet(net, enemies);
        }
      } else {
        for (const enemy of enemies) {
          if (enemy.hp > 0 && distance(net, enemy) <= net.netRadius + enemy.radius && !net.caught.has(enemy)) {
            net.caught.add(enemy);
            enemy.frozen = Math.max(enemy.frozen, net.netDuration);
            this.hitEnemy(enemy, net.damage, net, 60);
            this.floatText(enemy.x, enemy.y - enemy.radius, "Caught", net.color);
            if (net.thornBurst) {
              this.hitEnemy(enemy, net.damage * 0.75, net, 90);
              this.floatText(enemy.x, enemy.y - enemy.radius - 18, "Thorns", "#5ec28c");
            }
          }
        }
      }
    }
    this.nets = this.nets.filter((net) => net.life > 0);
  }

  springNet(net, enemies) {
    net.sprung = true;
    net.life = net.netDuration;
    for (const enemy of enemies) {
      if (enemy.hp > 0 && distance(net, enemy) <= net.netRadius + enemy.radius) {
        net.caught.add(enemy);
        enemy.frozen = Math.max(enemy.frozen, net.netDuration);
        this.hitEnemy(enemy, net.damage, net, 60);
        this.floatText(enemy.x, enemy.y - enemy.radius, "Caught", net.color);
        if (net.thornBurst) {
          this.hitEnemy(enemy, net.damage * 0.75, net, 90);
          this.floatText(enemy.x, enemy.y - enemy.radius - 18, "Thorns", "#5ec28c");
        }
      }
    }
  }

  updateIcePatches(dt, enemies) {
    for (const patch of this.icePatches) {
      patch.life -= dt;
      for (const enemy of enemies) {
        if (enemy.hp > 0 && distance(patch, enemy) <= patch.radius + enemy.radius) {
          enemy.slowed = Math.max(enemy.slowed ?? 0, patch.slow);
          if (patch.damagePerSecond) {
            this.hitEnemy(enemy, patch.damagePerSecond * dt, patch, 0);
          }
        }
      }
    }
    this.icePatches = this.icePatches.filter((patch) => patch.life > 0);
  }

  pullEnemies(player, radius, strength, dt) {
    for (const enemy of player.game.enemies) {
      if (enemy.hp <= 0 || distance(player, enemy) > radius) {
        continue;
      }
      const dir = normalize(player.x - enemy.x, player.y - enemy.y);
      enemy.x += dir.x * strength * dt;
      enemy.y += dir.y * strength * dt;
    }
  }

  areaDamage(player, radius, damage, knockback) {
    for (const enemy of player.game.enemies) {
      if (enemy.hp <= 0 || distance(player, enemy) > radius + enemy.radius) {
        continue;
      }
      this.hitEnemy(enemy, damage, player, knockback);
      this.floatText(enemy.x, enemy.y - enemy.radius, Math.round(damage).toString(), "#f2b85b");
    }
    this.floatText(player.x, player.y - 58, "Smash!", "#f2b85b");
  }

  hitEnemy(enemy, damage, source, knockback = 0) {
    if (enemy.shieldTimer > 0) {
      damageEnemy(enemy, damage * 0.18, source, knockback * 0.25);
      this.floatText(enemy.x, enemy.y - enemy.radius, "Counter-Argument", "#f6f1e8");
      const target = source.owner ?? source;
      if (target?.x !== undefined) {
        this.spawnEnemyProjectile({
          x: enemy.x,
          y: enemy.y,
          angle: angleTo(enemy, target),
          speed: 520,
          damage: Math.max(4, damage * 0.32),
          radius: 8,
          color: "#f6f1e8",
          life: 0.9,
          labelOnHit: "Pamphlets!"
        });
      }
      return;
    }
    if (enemy.bossKind === "dragon" && (enemy.dragonShieldDown ?? 0) <= 0) {
      damageEnemy(enemy, damage * 0.2, source, knockback * 0.25);
      this.floatText(enemy.x, enemy.y - enemy.radius - 20, "Dragon Shield", "#f2b85b");
      return;
    }
    damageEnemy(enemy, damage, source, knockback);
  }
}

function nearestTarget(source, targets) {
  if (!targets || targets.length === 0) {
    return null;
  }
  return targets.reduce((best, target) => (distance(source, target) < distance(source, best) ? target : best), targets[0]);
}

function damageEnemy(enemy, damage, source, knockback = 0) {
  enemy.hp -= damage;
  enemy.timeSinceHit = 0;
  enemy.regenerating = false;
  const owner = source?.owner ?? source;
  if (owner?.statBonuses?.lifesteal > 0 && owner.heal) {
    owner.heal(damage * owner.statBonuses.lifesteal);
  }
  if (owner?.statBonuses?.stunChance > 0 && Math.random() < owner.statBonuses.stunChance) {
    enemy.frozen = Math.max(enemy.frozen ?? 0, 0.55);
  }
  if (knockback > 0) {
    const dir = normalize(enemy.x - source.x, enemy.y - source.y);
    enemy.x += dir.x * knockback * 0.08;
    enemy.y += dir.y * knockback * 0.08;
  }
}

const postBossEnemyUnlocks = ["duelist", "seer", "mender", "shade", "bulwark"];
const ENEMY_REGEN_DELAY = 5;
const ENEMY_REGEN_RATE = 0.08;

function createEnemies(stage) {
  const enemies = [];
  if (stage.isBoss) {
    enemies.push(createEnemy("boss", stage, stage.room.width / 2, stage.room.margin + 170));
    return enemies;
  }

  const kindCycle = ["scout", "ranger", "scout", "bomber", "brute"];
  const bossTier = stage.bossTier ?? Math.floor((stage.number - 1) / 5);
  const postBossKinds = postBossEnemyUnlocks.slice(0, Math.min(bossTier, postBossEnemyUnlocks.length));
  for (let i = 0; i < stage.enemyCount; i += 1) {
    const unlocked = stage.number < 3 ? ["scout"] : [...kindCycle, ...postBossKinds];
    const kind = unlocked[i % unlocked.length];
    const spawn = randomSpawn(stage.room);
    enemies.push(createEnemy(kind, stage, spawn.x, spawn.y));
  }
  return enemies;
}

function createDragonEnemy(stage) {
  const spawn = stage.dragon?.spawn ?? { x: stage.room.width / 2, y: stage.room.height / 2 };
  return {
    type: "boss",
    bossKind: "dragon",
    name: "Kingdom Dragon",
    x: spawn.x,
    y: spawn.y,
    spawnX: spawn.x,
    spawnY: spawn.y,
    radius: 72,
    hp: 4200,
    maxHp: 4200,
    speed: 74,
    damage: 34,
    sightRange: Infinity,
    loseRange: Infinity,
    leashRange: Infinity,
    touchCooldown: 0.92,
    attackRange: Infinity,
    attackCooldown: 0,
    specialCooldown: 1.1,
    chargeTime: 0.5,
    chargeSpeed: 4.1,
    frozen: 0,
    slowed: 0,
    alert: true,
    state: "chase",
    stateTimer: 0,
    phase: 0,
    shieldTimer: 0,
    dragonShieldDown: 0,
    supporterTimer: Infinity,
    timeSinceHit: 0,
    regenerating: false,
    spriteAction: "idle",
    color: "#d95757",
    habit: "uses breath, fireballs, charges, and bites; gold bars stun it and break its shield"
  };
}

function updateEnemies(enemies, players, dt, room, combat) {
  const livePlayers = Array.isArray(players) ? players.filter((player) => player.hp > 0) : [players].filter(Boolean);
  if (livePlayers.length === 0) {
    return;
  }
  const targets = [
    ...livePlayers,
    ...livePlayers.flatMap((player) => player.petTaunts ?? []).filter((taunt) => taunt.timer > 0)
  ];

  for (const enemy of enemies) {
    const player = nearestPlayer(enemy, targets);
    tickEnemyTimers(enemy, dt);
    updateEnemyRegeneration(enemy, dt);
    updateEnemyStatuses(enemy, dt, combat);
    updatePerception(enemy, player);

    if (enemy.frozen <= 0) {
      updateEnemyBrain(enemy, player, dt, room, combat, enemies);
    }

    for (const obstacle of room.obstacles) {
      pushCircleOutOfRect(enemy, obstacle);
    }
    enemy.x = clamp(enemy.x, room.margin + enemy.radius, room.width - room.margin - enemy.radius);
    enemy.y = clamp(enemy.y, room.margin + enemy.radius, room.height - room.margin - enemy.radius);
    enemy.angle = angleTo(enemy, player);

    tryTouchDamage(enemy, player, combat);
  }
}

function nearestPlayer(enemy, players) {
  return players.reduce((best, player) => (distance(enemy, player) < distance(enemy, best) ? player : best), players[0]);
}

function createEnemy(type, stage, x, y) {
  if (type === "boss") {
    const isBroadcaster = stage.number === 5;
    return {
      type: "boss",
      bossKind: isBroadcaster ? "broadcaster" : "gatebreaker",
      name: isBroadcaster ? "Charlie Kirk, Campus Broadcaster" : `Gatebreaker ${Math.ceil(stage.number / 5)}`,
      x,
      y,
      spawnX: x,
      spawnY: y,
      radius: isBroadcaster ? 42 : 52,
      hp: (isBroadcaster ? 560 : 470) * stage.enemyHpMultiplier,
      maxHp: (isBroadcaster ? 560 : 470) * stage.enemyHpMultiplier,
      speed: isBroadcaster ? 78 : 88,
      damage: (isBroadcaster ? 19 : 23) * stage.enemyDamageMultiplier,
      sightRange: Infinity,
      loseRange: Infinity,
      leashRange: Infinity,
      touchCooldown: 0.8,
      attackRange: Infinity,
      attackCooldown: 0,
      specialCooldown: 1.6,
      frozen: 0,
      slowed: 0,
      alert: true,
      state: "chase",
      stateTimer: 0,
      phase: 0,
      shieldTimer: 0,
      supporterTimer: isBroadcaster ? 4.5 : Infinity,
      timeSinceHit: 0,
      regenerating: false,
      spriteAction: "idle",
      color: isBroadcaster ? "#263a74" : "#a747d9",
      habit: isBroadcaster ? "uses media-themed attacks and summons supporters" : "tracks the whole room and alternates bullet patterns"
    };
  }

  const base = enemyKinds[type] ?? enemyKinds.scout;
  return {
    ...base,
    type,
    x,
    y,
    spawnX: x,
    spawnY: y,
    hp: base.hp * stage.enemyHpMultiplier,
    maxHp: base.hp * stage.enemyHpMultiplier,
    damage: base.damage * stage.enemyDamageMultiplier,
    attackCooldown: randomRange(0.1, 0.7),
    specialCooldown: randomRange(0.6, 1.8),
    frozen: 0,
    slowed: 0,
    alert: type === "supporter",
    state: type === "supporter" ? "chase" : "wander",
    stateTimer: 0,
    timeSinceHit: 0,
    regenerating: false,
    wander: newWander(),
    strafeDir: Math.random() < 0.5 ? -1 : 1,
    charge: null
  };
}

function tickEnemyTimers(enemy, dt) {
  enemy.attackCooldown = Math.max(0, enemy.attackCooldown - dt);
  enemy.specialCooldown = Math.max(0, enemy.specialCooldown - dt);
  enemy.frozen = Math.max(0, enemy.frozen - dt);
  enemy.slowed = Math.max(0, (enemy.slowed ?? 0) - dt);
  enemy.shieldTimer = Math.max(0, (enemy.shieldTimer ?? 0) - dt);
  enemy.dragonShieldDown = Math.max(0, (enemy.dragonShieldDown ?? 0) - dt);
  enemy.supporterTimer = Math.max(0, (enemy.supporterTimer ?? 0) - dt);
  enemy.stateTimer = Math.max(0, enemy.stateTimer - dt);
  if (enemy.wander) {
    enemy.wander.timer -= dt;
  }
}

function updateEnemyRegeneration(enemy, dt) {
  enemy.timeSinceHit = (enemy.timeSinceHit ?? 0) + dt;
  enemy.regenerating = false;
  if (enemy.hp <= 0 || enemy.hp >= enemy.maxHp || enemy.timeSinceHit < ENEMY_REGEN_DELAY) {
    return;
  }

  enemy.regenerating = true;
  enemy.hp = Math.min(enemy.maxHp, enemy.hp + enemy.maxHp * ENEMY_REGEN_RATE * dt);
}

function updateEnemyStatuses(enemy, dt, combat) {
  if (enemy.poisoned?.timer > 0) {
    enemy.poisoned.timer -= dt;
    enemy.hp -= enemy.maxHp * enemy.poisoned.rate * dt;
    enemy.timeSinceHit = 0;
    enemy.regenerating = false;
    if (Math.random() < 0.02) {
      combat.floatText(enemy.x, enemy.y - enemy.radius - 12, "Poison", "#5ec28c");
    }
  }
  if (enemy.bleeding?.timer > 0) {
    enemy.bleeding.timer -= dt;
    enemy.hp -= enemy.maxHp * enemy.bleeding.rate * dt;
    enemy.timeSinceHit = 0;
    enemy.regenerating = false;
    if (Math.random() < 0.02) {
      combat.floatText(enemy.x, enemy.y - enemy.radius - 12, "Bleed", "#d95757");
    }
  }
  if (enemy.burning?.timer > 0) {
    enemy.burning.timer -= dt;
    enemy.hp -= enemy.maxHp * enemy.burning.rate * dt;
    enemy.timeSinceHit = 0;
    enemy.regenerating = false;
    if (Math.random() < 0.03) {
      combat.floatText(enemy.x, enemy.y - enemy.radius - 12, "Burn", "#ef7d57");
    }
  }
}

function updatePerception(enemy, player) {
  const playerDistance = distance(enemy, player);
  const spawnDistance = distance(enemy, { x: enemy.spawnX, y: enemy.spawnY });

  if (!enemy.alert && playerDistance <= enemy.sightRange) {
    enemy.alert = true;
    enemy.state = "chase";
  }

  if (enemy.alert && playerDistance > enemy.loseRange && spawnDistance > enemy.leashRange * 0.45) {
    enemy.alert = false;
    enemy.state = "return";
  }

  if (enemy.alert && spawnDistance > enemy.leashRange && playerDistance > enemy.sightRange * 0.7) {
    enemy.alert = false;
    enemy.state = "return";
  }
}

function updateEnemyBrain(enemy, player, dt, room, combat, enemies) {
  if (enemy.state === "return") {
    moveToward(enemy, { x: enemy.spawnX, y: enemy.spawnY }, dt, speedFor(enemy) * 0.9);
    if (distance(enemy, { x: enemy.spawnX, y: enemy.spawnY }) < 28) {
      enemy.state = "wander";
      enemy.wander = newWander();
    }
    return;
  }

  if (!enemy.alert) {
    updateWander(enemy, dt);
    return;
  }

  if (enemy.state === "windup") {
    if (enemy.stateTimer <= 0) {
      finishWindup(enemy, player, combat, enemies);
    }
    return;
  }

  if (enemy.state === "charge") {
    updateCharge(enemy, dt);
    return;
  }

  if (enemy.type === "ranger") {
    updateRanger(enemy, player, dt, combat);
    return;
  }

  if (enemy.type === "brute") {
    updateBrute(enemy, player, dt, combat);
    return;
  }

  if (enemy.type === "bomber") {
    updateBomber(enemy, player, dt, combat);
    return;
  }

  if (enemy.type === "supporter") {
    updateSupporter(enemy, player, dt, combat);
    return;
  }

  if (enemy.type === "duelist") {
    updateDuelist(enemy, player, dt, combat);
    return;
  }

  if (enemy.type === "seer") {
    updateSeer(enemy, player, dt, combat);
    return;
  }

  if (enemy.type === "mender") {
    updateMender(enemy, player, dt, combat, enemies);
    return;
  }

  if (enemy.type === "shade") {
    updateShade(enemy, player, dt, combat);
    return;
  }

  if (enemy.type === "bulwark") {
    updateBulwark(enemy, player, dt, combat);
    return;
  }

  if (enemy.type === "boss") {
    if (enemy.bossKind === "dragon") {
      updateDragonBoss(enemy, player, dt, combat);
      return;
    }
    updateBoss(enemy, player, dt, combat, enemies, room);
    return;
  }

  updateScout(enemy, player, dt);
}

function updateWander(enemy, dt) {
  if (!enemy.wander || enemy.wander.timer <= 0) {
    enemy.wander = newWander();
  }

  const drift = normalize(enemy.spawnX - enemy.x, enemy.spawnY - enemy.y);
  const farFromSpawn = distance(enemy, { x: enemy.spawnX, y: enemy.spawnY }) > enemy.leashRange * 0.35;
  const dir = farFromSpawn ? drift : enemy.wander;
  const speed = enemy.wander.pause ? 0 : enemy.wanderSpeed;
  enemy.x += dir.x * speed * dt;
  enemy.y += dir.y * speed * dt;
}

function updateScout(enemy, player, dt) {
  const base = normalize(player.x - enemy.x, player.y - enemy.y);
  const zigzag = Math.sin(performance.now() / 280 + enemy.spawnX) * 0.34;
  const dir = normalize(base.x - base.y * zigzag, base.y + base.x * zigzag);
  enemy.x += dir.x * speedFor(enemy) * dt;
  enemy.y += dir.y * speedFor(enemy) * dt;
}

function updateRanger(enemy, player, dt, combat) {
  const dist = distance(enemy, player);
  const toPlayer = normalize(player.x - enemy.x, player.y - enemy.y);
  const strafe = { x: -toPlayer.y * enemy.strafeDir, y: toPlayer.x * enemy.strafeDir };
  let move = strafe;

  if (dist < enemy.preferredMin) {
    move = normalize(enemy.x - player.x + strafe.x * 0.5, enemy.y - player.y + strafe.y * 0.5);
  } else if (dist > enemy.preferredMax) {
    move = normalize(player.x - enemy.x + strafe.x * 0.35, player.y - enemy.y + strafe.y * 0.35);
  }

  enemy.x += move.x * speedFor(enemy) * dt;
  enemy.y += move.y * speedFor(enemy) * dt;

  if (enemy.specialCooldown <= 0 && dist <= enemy.attackRange) {
    startWindup(enemy, "shoot", enemy.windupTime, combat, "Aim");
  }

  if (Math.random() < 0.008) {
    enemy.strafeDir *= -1;
  }
}

function updateSupporter(enemy, player, dt, combat) {
  const dist = distance(enemy, player);
  if (dist > 260) {
    moveToward(enemy, player, dt, speedFor(enemy));
  }
  if (enemy.specialCooldown <= 0 && dist <= enemy.attackRange) {
    startWindup(enemy, "supporterPamphlet", enemy.windupTime, combat, "!");
  }
}

function updateBrute(enemy, player, dt, combat) {
  const dist = distance(enemy, player);
  if (enemy.specialCooldown <= 0 && dist <= enemy.chargeRange) {
    startWindup(enemy, "charge", enemy.windupTime, combat, "Charge");
    return;
  }
  moveToward(enemy, player, dt, speedFor(enemy));
}

function updateBomber(enemy, player, dt, combat) {
  const dist = distance(enemy, player);
  if (dist <= enemy.attackRange && enemy.specialCooldown <= 0) {
    startWindup(enemy, "explode", enemy.windupTime, combat, "Boom");
    return;
  }
  moveToward(enemy, player, dt, speedFor(enemy) * 1.12);
}

function updateDuelist(enemy, player, dt, combat) {
  const dist = distance(enemy, player);
  if (enemy.specialCooldown <= 0 && dist <= enemy.chargeRange) {
    startWindup(enemy, "charge", enemy.windupTime, combat, "Lunge");
    return;
  }
  moveToward(enemy, player, dt, speedFor(enemy) * 1.08);
}

function updateSeer(enemy, player, dt, combat) {
  const dist = distance(enemy, player);
  const toPlayer = normalize(player.x - enemy.x, player.y - enemy.y);
  const strafe = { x: -toPlayer.y * enemy.strafeDir, y: toPlayer.x * enemy.strafeDir };
  let move = strafe;

  if (dist < enemy.preferredMin) {
    move = normalize(enemy.x - player.x + strafe.x * 0.65, enemy.y - player.y + strafe.y * 0.65);
  } else if (dist > enemy.preferredMax) {
    move = normalize(player.x - enemy.x + strafe.x * 0.25, player.y - enemy.y + strafe.y * 0.25);
  }

  enemy.x += move.x * speedFor(enemy) * dt;
  enemy.y += move.y * speedFor(enemy) * dt;
  if (enemy.specialCooldown <= 0 && distance(enemy, player) <= enemy.attackRange) {
    startWindup(enemy, "seerBolt", enemy.windupTime, combat, "Hex");
  }
  if (Math.random() < 0.006) {
    enemy.strafeDir *= -1;
  }
}

function updateMender(enemy, player, dt, combat, enemies) {
  const wounded = enemies
    .filter((candidate) => candidate !== enemy && candidate.hp > 0 && candidate.hp < candidate.maxHp && distance(enemy, candidate) < 360)
    .sort((a, b) => a.hp / a.maxHp - b.hp / b.maxHp)[0];

  if (wounded && enemy.specialCooldown <= 0) {
    wounded.hp = Math.min(wounded.maxHp, wounded.hp + wounded.maxHp * 0.16);
    combat.floatText(wounded.x, wounded.y - wounded.radius, "Mended", "#5ec28c");
    enemy.specialCooldown = randomRange(2.4, 3.4);
  }

  const dist = distance(enemy, player);
  if (dist > 340) {
    moveToward(enemy, player, dt, speedFor(enemy) * 0.84);
  }
  if (enemy.attackCooldown <= 0 && dist <= enemy.attackRange) {
    shootAtPlayer(enemy, player, combat, 360, enemy.damage * 0.9, "#5ec28c");
    enemy.attackCooldown = randomRange(1.4, 2.1);
  }
}

function updateShade(enemy, player, dt, combat) {
  const dist = distance(enemy, player);
  if (enemy.specialCooldown <= 0 && dist <= enemy.blinkRange && dist > 130) {
    const angle = angleTo(player, enemy) + randomRange(-0.7, 0.7);
    enemy.x = player.x + Math.cos(angle) * 96;
    enemy.y = player.y + Math.sin(angle) * 96;
    combat.floatText(enemy.x, enemy.y - enemy.radius, "Blink", "#afa89e");
    enemy.specialCooldown = randomRange(2.6, 3.6);
    return;
  }
  moveToward(enemy, player, dt, speedFor(enemy) * 1.1);
}

function updateBulwark(enemy, player, dt, combat) {
  const dist = distance(enemy, player);
  if (enemy.specialCooldown <= 0 && dist <= 300) {
    startWindup(enemy, "bulwarkSlam", enemy.windupTime, combat, "Slam");
    return;
  }
  moveToward(enemy, player, dt, speedFor(enemy) * 0.86);
}

function updateBoss(enemy, player, dt, combat, enemies, room) {
  if (enemy.bossKind === "broadcaster") {
    updateBroadcasterBoss(enemy, player, dt, combat, enemies, room);
    return;
  }

  const dist = distance(enemy, player);
  if (dist > 220) {
    moveToward(enemy, player, dt, speedFor(enemy));
  }
  if (enemy.specialCooldown <= 0) {
    startWindup(enemy, "bossPattern", enemy.hp < enemy.maxHp * 0.5 ? 0.36 : 0.52, combat, "Cast");
  }
}

function updateBroadcasterBoss(enemy, player, dt, combat, enemies, room) {
  const dist = distance(enemy, player);
  enemy.spriteAction = enemy.shieldTimer > 0 ? "table" : "idle";

  if (dist > 270) {
    moveToward(enemy, player, dt, speedFor(enemy));
    enemy.spriteAction = "walk";
  }

  if (enemy.supporterTimer <= 0) {
    const supporters = enemies.filter((candidate) => candidate.type === "supporter").length;
    if (supporters < 4) {
      const spawn = supportSpawn(room, enemy);
      enemies.push(createEnemy("supporter", { enemyHpMultiplier: 1, enemyDamageMultiplier: 1 }, spawn.x, spawn.y));
      combat.floatText(spawn.x, spawn.y - 28, "Supporter", "#73a9ff");
    }
    enemy.supporterTimer = randomRange(6.5, 8.5);
  }

  if (enemy.specialCooldown <= 0) {
    const cycle = ["micDrop", "table", "phone", "liveStream"];
    const action = cycle[enemy.phase % cycle.length];
    enemy.phase += 1;
    const windup = action === "liveStream" ? 0.72 : action === "table" ? 0.28 : 0.45;
    const label = {
      micDrop: "Mic Drop",
      table: "Campus Table",
      phone: "Barrage",
      liveStream: "LIVE"
    }[action];
    startWindup(enemy, action, windup, combat, label);
  }
}

function startWindup(enemy, nextAction, duration, combat, label) {
  enemy.state = "windup";
  enemy.nextAction = nextAction;
  enemy.stateTimer = duration;
  combat.floatText(enemy.x, enemy.y - enemy.radius, label, "#f2b85b");

  if (enemy.bossKind === "broadcaster" && broadcasterDialogue[nextAction]) {
    combat.speak(enemy, pickLine(broadcasterDialogue[nextAction]), {
      accent: nextAction === "liveStream" ? "#476ac7" : "#d95757",
      duration: nextAction === "liveStream" ? 2.15 : 1.7,
      offsetY: -enemy.radius - 72
    });
  }
}

function finishWindup(enemy, player, combat, enemies = []) {
  if (enemy.nextAction === "dragonBreath") {
    const baseAngle = angleTo(enemy, player);
    for (let i = -3; i <= 3; i += 1) {
      combat.spawnEnemyProjectile({
        x: enemy.x + Math.cos(baseAngle) * 54,
        y: enemy.y + Math.sin(baseAngle) * 54,
        angle: baseAngle + i * 0.16,
        speed: 420,
        damage: enemy.damage * 0.48,
        radius: 15,
        color: "#ef7d57",
        life: 1.05,
        labelOnHit: "Burned"
      });
    }
    enemy.specialCooldown = 1.6;
    enemy.state = "chase";
    return;
  }

  if (enemy.nextAction === "dragonFireball") {
    const baseAngle = angleTo(enemy, player);
    for (let i = -1; i <= 1; i += 1) {
      combat.spawnEnemyProjectile({
        x: enemy.x,
        y: enemy.y,
        angle: baseAngle + i * 0.14,
        speed: 330,
        damage: enemy.damage * 0.72,
        radius: 20,
        color: "#f2b85b",
        homing: true,
        life: 1.75,
        labelOnHit: "Fireball"
      });
    }
    enemy.specialCooldown = 2.1;
    enemy.state = "chase";
    return;
  }

  if (enemy.nextAction === "dragonBite") {
    const hit = distance(enemy, player) <= enemy.radius + player.radius + 34 && player.takeDamage(enemy.damage * 1.45);
    if (hit) {
      combat.floatText(player.x, player.y - 46, `-${Math.round(enemy.damage * 1.45)}`, "#d95757");
      combat.screenShake = Math.max(combat.screenShake, 10);
    }
    enemy.specialCooldown = 1.2;
    enemy.state = "chase";
    return;
  }

  if (enemy.nextAction === "supporterPamphlet") {
    combat.spawnEnemyProjectile({
      x: enemy.x,
      y: enemy.y,
      angle: angleTo(enemy, player),
      speed: 430,
      damage: enemy.damage,
      radius: 7,
      color: "#f6f1e8",
      life: 1.0,
      labelOnHit: "Pamphlet"
    });
    enemy.specialCooldown = randomRange(1.3, 2.1);
    enemy.state = "chase";
    return;
  }

  if (enemy.nextAction === "micDrop") {
    enemy.spriteAction = "micDrop";
    const baseAngle = angleTo(enemy, player);
    for (let i = -1; i <= 1; i += 1) {
      combat.spawnEnemyProjectile({
        x: enemy.x,
        y: enemy.y,
        angle: baseAngle + i * 0.08,
        speed: 680,
        damage: enemy.damage * 0.42,
        radius: 14,
        color: "#f6f1e8",
        life: 0.75,
        labelOnHit: "!!!"
      });
    }
    enemy.specialCooldown = 1.45;
    enemy.state = "chase";
    return;
  }

  if (enemy.nextAction === "table") {
    enemy.spriteAction = "table";
    enemy.shieldTimer = 2.8;
    enemy.specialCooldown = 1.4;
    enemy.state = "chase";
    combat.floatText(enemy.x, enemy.y - enemy.radius, "Shield up", "#f6f1e8");
    return;
  }

  if (enemy.nextAction === "phone") {
    enemy.spriteAction = "phone";
    const baseAngle = angleTo(enemy, player);
    for (let i = 0; i < 9; i += 1) {
      combat.spawnEnemyProjectile({
        x: enemy.x + Math.cos(baseAngle) * 28,
        y: enemy.y + Math.sin(baseAngle) * 28,
        angle: baseAngle + (i - 4) * 0.12,
        speed: 400 + i * 22,
        damage: enemy.damage * 0.34,
        radius: 9,
        color: i % 3 === 0 ? "#73a9ff" : i % 3 === 1 ? "#f6f1e8" : "#d95757",
        slow: 1.35,
        homing: true,
        life: 1.4,
        labelOnHit: "Overwhelmed"
      });
    }
    enemy.specialCooldown = 1.9;
    enemy.state = "chase";
    return;
  }

  if (enemy.nextAction === "liveStream") {
    enemy.spriteAction = "liveStream";
    combat.screenShake = Math.max(combat.screenShake, 18);
    enemy.hp = Math.min(enemy.maxHp, enemy.hp + enemy.maxHp * 0.04);
    for (const ally of enemies) {
      if (ally.type === "supporter" && ally.hp > 0) {
        ally.hp = Math.min(ally.maxHp, ally.hp + ally.maxHp * 0.25);
      }
    }
    combat.floatText(enemy.x, enemy.y - enemy.radius, "The Live Stream", "#f2b85b");
    for (let i = 0; i < 16; i += 1) {
      combat.spawnEnemyProjectile({
        x: enemy.x,
        y: enemy.y,
        angle: (Math.PI * 2 * i) / 16,
        speed: 360,
        damage: enemy.damage * 0.36,
        radius: 10,
        color: i % 3 === 0 ? "#d95757" : i % 3 === 1 ? "#f6f1e8" : "#476ac7",
        slow: 1.4,
        life: 1.2,
        labelOnHit: "ON AIR!"
      });
    }
    enemy.specialCooldown = 3.6;
    enemy.state = "chase";
    return;
  }

  if (enemy.nextAction === "shoot") {
    shootAtPlayer(enemy, player, combat, 450, enemy.damage * 1.15, "#73a9ff");
    enemy.specialCooldown = randomRange(1.1, 1.7);
    enemy.state = "chase";
    return;
  }

  if (enemy.nextAction === "seerBolt") {
    const baseAngle = angleTo(enemy, player);
    for (let i = -1; i <= 1; i += 1) {
      combat.spawnEnemyProjectile({
        x: enemy.x,
        y: enemy.y,
        angle: baseAngle + i * 0.2,
        speed: 330,
        damage: enemy.damage,
        radius: 8,
        color: "#a747d9",
        homing: true,
        slow: 1.1,
        life: 1.55,
        labelOnHit: "Hexed"
      });
    }
    enemy.specialCooldown = randomRange(1.7, 2.4);
    enemy.state = "chase";
    return;
  }

  if (enemy.nextAction === "bulwarkSlam") {
    for (let i = 0; i < 10; i += 1) {
      combat.spawnEnemyProjectile({
        x: enemy.x,
        y: enemy.y,
        angle: (Math.PI * 2 * i) / 10,
        speed: 260,
        damage: enemy.damage * 0.54,
        radius: 10,
        color: "#b56b34",
        life: 0.85
      });
    }
    combat.screenShake = Math.max(combat.screenShake, 8);
    enemy.specialCooldown = randomRange(2.6, 3.4);
    enemy.state = "chase";
    return;
  }

  if (enemy.nextAction === "charge") {
    const dir = normalize(player.x - enemy.x, player.y - enemy.y);
    enemy.charge = { x: dir.x, y: dir.y, time: enemy.chargeTime };
    enemy.state = "charge";
    enemy.specialCooldown = randomRange(2.2, 3.2);
    return;
  }

  if (enemy.nextAction === "explode") {
    const hit = distance(enemy, player) <= enemy.attackRange + player.radius && player.takeDamage(enemy.damage * 1.3);
    if (hit) {
      combat.floatText(player.x, player.y - 46, `-${Math.round(enemy.damage * 1.3)}`, "#f2b85b");
    }
    combat.floatText(enemy.x, enemy.y - enemy.radius, "Boom", "#f2b85b");
    enemy.hp = 0;
    combat.screenShake = Math.max(combat.screenShake, 10);
    return;
  }

  if (enemy.nextAction === "bossPattern") {
    bossPattern(enemy, player, combat);
    enemy.specialCooldown = enemy.hp < enemy.maxHp * 0.5 ? randomRange(1.5, 2) : randomRange(2.1, 2.8);
    enemy.state = "chase";
  }
}

function updateDragonBoss(enemy, player, dt, combat) {
  const dist = distance(enemy, player);
  if (dist > 210) {
    moveToward(enemy, player, dt, speedFor(enemy));
  }

  if (enemy.specialCooldown > 0) {
    return;
  }

  const cycle = ["dragonBreath", "dragonFireball", "charge", "dragonBite"];
  const action = cycle[enemy.phase % cycle.length];
  enemy.phase += 1;
  const label = {
    dragonBreath: "Dragon Breath",
    dragonFireball: "Fireball",
    charge: "Charge",
    dragonBite: "Bite"
  }[action];
  const windup = action === "charge" ? 0.44 : action === "dragonBite" ? 0.24 : 0.52;
  startWindup(enemy, action, windup, combat, label);
}

function updateCharge(enemy, dt) {
  enemy.x += enemy.charge.x * speedFor(enemy) * enemy.chargeSpeed * dt;
  enemy.y += enemy.charge.y * speedFor(enemy) * enemy.chargeSpeed * dt;
  enemy.charge.time -= dt;
  if (enemy.charge.time <= 0) {
    enemy.charge = null;
    enemy.state = "chase";
  }
}

function tryTouchDamage(enemy, player, combat) {
  const hitDistance = enemy.radius + player.radius + 4;
  if (distance(enemy, player) > hitDistance || enemy.attackCooldown > 0) {
    return;
  }

  const hit = player.takeDamage(enemy.damage);
  enemy.attackCooldown = enemy.touchCooldown;
  if (hit) {
    combat.floatText(player.x, player.y - 46, `-${Math.round(enemy.damage)}`, "#d95757");
    combat.screenShake = Math.max(combat.screenShake, 7);
  }
}

function bossPattern(enemy, player, combat) {
  enemy.phase += 1;
  if (enemy.phase % 2 === 0) {
    const baseAngle = angleTo(enemy, player);
    for (let i = -2; i <= 2; i += 1) {
      combat.spawnEnemyProjectile({
        x: enemy.x,
        y: enemy.y,
        angle: baseAngle + i * 0.18,
        speed: 430,
        damage: enemy.damage * 0.75,
        radius: 11,
        color: "#a747d9"
      });
    }
    return;
  }

  for (let i = 0; i < 12; i += 1) {
    combat.spawnEnemyProjectile({
      x: enemy.x,
      y: enemy.y,
      angle: (Math.PI * 2 * i) / 12,
      speed: 330,
      damage: enemy.damage * 0.55,
      radius: 10,
      color: "#f2b85b"
    });
  }
}

function supportSpawn(room, boss) {
  const angle = randomRange(0, Math.PI * 2);
  const radius = randomRange(180, 280);
  return {
    x: clamp(boss.x + Math.cos(angle) * radius, room.margin + 50, room.width - room.margin - 50),
    y: clamp(boss.y + Math.sin(angle) * radius, room.margin + 50, room.height - room.margin - 50)
  };
}

function shootAtPlayer(enemy, player, combat, speed, damage, color) {
  combat.spawnEnemyProjectile({
    x: enemy.x + Math.cos(enemy.angle || angleTo(enemy, player)) * enemy.radius,
    y: enemy.y + Math.sin(enemy.angle || angleTo(enemy, player)) * enemy.radius,
    angle: angleTo(enemy, player),
    speed,
    damage,
    radius: 8,
    color
  });
}

function speedFor(enemy) {
  return enemy.speed * (enemy.slowed > 0 ? 0.55 : 1);
}

function moveToward(enemy, target, dt, speed) {
  const dir = normalize(target.x - enemy.x, target.y - enemy.y);
  enemy.x += dir.x * speed * dt;
  enemy.y += dir.y * speed * dt;
}

function newWander() {
  const angle = randomRange(0, Math.PI * 2);
  return {
    x: Math.cos(angle),
    y: Math.sin(angle),
    timer: randomRange(0.7, 1.8),
    pause: Math.random() < 0.28
  };
}

function pickLine(lines) {
  return lines[Math.floor(Math.random() * lines.length)];
}

function randomSpawn(room) {
  for (let attempt = 0; attempt < 25; attempt += 1) {
    const spawn = {
      x: randomRange(room.margin + 40, room.width - room.margin - 40),
      y: randomRange(room.margin + 40, room.height - room.margin - 40),
      radius: 34
    };
    const nearCenter = Math.abs(spawn.x - room.width / 2) < 260 && Math.abs(spawn.y - room.height / 2) < 200;
    const blocked = room.obstacles.some((obstacle) => spawn.x > obstacle.x - 60 && spawn.x < obstacle.x + obstacle.w + 60 && spawn.y > obstacle.y - 60 && spawn.y < obstacle.y + obstacle.h + 60);
    if (!nearCenter && !blocked) {
      return spawn;
    }
  }
  return { x: room.margin + 120, y: room.margin + 120 };
}



// src/loot.js

const roomChestWeights = {

  uncommon: 31,
  rare: 9,
  epic: 1,
  legendary: 1
};

const bossChestWeights = {

  uncommon: 18,
  rare: 46,
  epic: 24,
  legendary: 12
};

function createRewardChest(x, y, source = "reward chest", rarity = "common") {
  const tier = chestTiers[rarity] ?? chestTiers.common;
  return {
    id: `reward-${Math.random().toString(16).slice(2)}`,
    type: "chest",
    source,
    rarity,
    name: tier.name,
    x,
    y,
    radius: 34,
    color: tier.color,
    opened: false,
    bob: Math.random() * Math.PI * 2
  };
}

function createHealthPotion(x, y, healAmount = 32) {
  return {
    id: `health-${Math.random().toString(16).slice(2)}`,
    type: "healthPotion",
    x,
    y,
    radius: 22,
    healAmount,
    color: "#d95757",
    bob: Math.random() * Math.PI * 2
  };
}

function createBlueprintDrop(blueprintId, name, player, x, y, description = "") {
  return {
    id: `blueprint-${blueprintId}-${player.playerIndex}-${Math.random().toString(16).slice(2)}`,
    type: "blueprint",
    blueprintId,
    name,
    playerIndex: player.playerIndex,
    playerLabel: player.label,
    description,
    x,
    y,
    radius: 28,
    color: "#73a9ff",
    bob: Math.random() * Math.PI * 2
  };
}

function createMaterialDrop(material, amount, player, x, y) {

  const name = isCore ? "Tempered Core" : "Weapon Ore";
  return {
    id: `material-${material}-${player.playerIndex}-${Math.random().toString(16).slice(2)}`,
    type: "material",
    material,
    amount,
    name,
    playerIndex: player.playerIndex,
    playerLabel: player.label,
    x,
    y,
    radius: isCore ? 24 : 21,
    color: isCore ? "#f2b85b" : "#73a9ff",
    bob: Math.random() * Math.PI * 2
  };
}

function createGoldBar(x, y) {
  return {
    id: `gold-bar-${Math.random().toString(16).slice(2)}`,
    type: "goldBar",
    name: "Gold Bar",
    x,
    y,
    radius: 25,
    color: "#f2b85b",
    bob: Math.random() * Math.PI * 2
  };
}

function createShop(x, y) {
  return {
    id: `shop-${Math.random().toString(16).slice(2)}`,
    type: "shop",
    name: "Classbound Shop",
    x,
    y,
    radius: 38,
    color: "#f2b85b",
    stock: null,
    bob: Math.random() * Math.PI * 2
  };
}

function createQuestPortal(x, y) {
  return {
    id: "hidden-quest-portal",
    type: "questPortal",
    name: "Hidden Quest Portal",
    x,
    y,
    radius: 44,
    color: "#a747d9",
    bob: 0
  };
}

function createSage(x, y) {
  return {
    id: "sage",
    type: "sage",
    name: "Maze Sage",
    x,
    y,
    radius: 34,
    color: "#f2b85b",
    bob: Math.random() * Math.PI * 2

}

function createLobbyCharacter(character, x, y) {
  return {
    id: `lobby-character-${character.id}`,
    type: "lobbyCharacter",
    characterId: character.id,
    name: character.name,
    role: character.role,
    x,
    y,
    radius: 38,
    color: character.color,
    accent: character.accent,
    bob: Math.random() * Math.PI * 2
  };
}

function createLobbyPortal(x, y) {
  return {
    id: "lobby-dungeon-portal",
    type: "lobbyPortal",
    name: "Dungeon Gate",
    x,
    y,
    radius: 48,
    color: "#73a9ff",
    bob: 0
  };
}

function createLobbySpot(id, name, x, y) {
  return {
    id,
    type: "lobbySpot",
    name,
    x,
    y,
    radius: 34,
    color: "#afa89e",
    bob: Math.random() * Math.PI * 2
  };
}

function createPortal(x, y) {
  return {
    id: "portal",
    type: "portal",
    x,
    y,
    radius: 42,
    color: "#73a9ff",
    bob: 0
  };
}

function spawnRewardLoot(stage, player) {
  const rarity = rollChestRarity(stage);
  const drops = [
    createRewardChest(
      player.x + randomRange(-70, 70),
      player.y + randomRange(-55, 55),
      stage.isBoss ? "boss reward" : "room reward",
      rarity
    )
  ];
  if (isShopStage(stage.number)) {
    drops.push(createShop(player.x + randomRange(92, 138), player.y + randomRange(-64, 64)));
  }
  drops.push(createPortal(stage.room.width / 2, stage.room.margin + 78));
  return drops;
}

function isShopStage(stageNumber) {
  const floorAfterBoss = ((stageNumber - 1) % 5) + 1;
  return floorAfterBoss === 2 || floorAfterBoss === 4;
}

function rollChestRarity(stage) {
  const weights = stage.isBoss ? bossChestWeights : roomChestWeights;
  const total = Object.values(weights).reduce((sum, value) => sum + value, 0);
  let pick = Math.random() * total;
  for (const [rarity, weight] of Object.entries(weights)) {
    pick -= weight;
    if (pick <= 0) {
      return rarity;
    }
  }
  return stage.isBoss ? "rare" : "common";
}

function nearestInteractable(loot, player) {
  let best = null;
  let bestDistance = Infinity;
  for (const item of loot) {
    if ((item.type === "blueprint" || item.type === "material") && item.playerIndex !== player.playerIndex) {
      continue;
    }
    const reach = item.type === "portal" || item.type === "questPortal" || item.type === "lobbyPortal" ? 86 : item.type === "shop" || item.type === "sage" || item.type === "lobbyCharacter" || item.type === "lobbySpot" || item.type === "goldBar" ? 78 : 62;
    const bonusReach = player.passives?.has("magnetCharm") ? reach * 2 : reach;
    const dist = distance(item, player);
    if (dist <= bonusReach && dist < bestDistance) {
      best = item;
      bestDistance = dist;
    }
  }
  return best;
}



// src/player.js

const P1_CONTROLS = {
  moveUp: "moveUp",
  moveDown: "moveDown",
  moveLeft: "moveLeft",
  moveRight: "moveRight",
  dash: "dash",
  autoAimAttack: "autoAimAttack",
  ability: "ability",
  extraAbility: "extraAbility",
  interact: "interact"
};

const P2_CONTROLS = {
  moveUp: "p2MoveUp",
  moveDown: "p2MoveDown",
  moveLeft: "p2MoveLeft",
  moveRight: "p2MoveRight",
  dash: "p2Dash",
  autoAimAttack: "p2AutoAimAttack",
  ability: "p2Ability",
  extraAbility: "p2ExtraAbility",
  interact: "p2Interact"
};

class Player {
  constructor(character, stageRoom, options = {}) {
    this.character = character;
    this.playerIndex = options.playerIndex ?? 0;
    this.label = options.label ?? `P${this.playerIndex + 1}`;
    this.controls = options.controls ?? (this.playerIndex === 1 ? P2_CONTROLS : P1_CONTROLS);
    this.x = stageRoom.width / 2 + (options.spawnOffsetX ?? 0);
    this.y = stageRoom.height / 2;
    this.radius = 24;
    this.hp = character.maxHp;
    this.maxHp = character.maxHp;
    this.facing = 0;
    this.lastMove = { x: 1, y: 0 };
    this.classWeapon = weapons[character.fixedWeapon] ?? weapons[character.starterWeapons?.[0]] ?? weapons.ironSaber;
    this.secretWeapon = null;
    this.baseDamage = character.baseDamage ?? 1;
    this.attackTimer = 0;
    this.dashTimer = 0;
    this.dashing = 0;
    this.invulnerable = 0;
    this.abilityCooldowns = {};
    this.abilityState = null;
    this.extraAbilityId = null;
    this.extraAbilityCooldown = 0;
    this.canMannequinTransform = character.id === "mannequin";
    this.transformEntry = {
      active: false,
      buffer: "",
      timer: 0
    };
    this.score = 0;
    this.gold = 0;
    this.materials = {
      weapon: 0,
      weaponCore: 0,
      hero: 0
    };
    this.blueprints = {
      weaponEvolution: false,
      heroAscension: false
    };
    this.questlines = {
      hidden: {
        started: false,
        stage: null,
        progress: 0
      },
      kingdom: {
        started: false,
        stage: null,
        complete: false
      }
    };
    this.dragonHeart = false;
    this.dragonFireBreath = false;
    this.inventoryMessage = "";
    this.isMoving = false;
    this.animationTime = 0;
    this.slowed = 0;
    this.statBonuses = {
      attackDamage: 0,
      attackSpeed: 0,
      moveSpeed: 0,
      dashCooldown: 0,
      abilityCooldown: 0,
      dashDistance: 0,
      projectileSpeed: 0,
      damageReduction: 0,
      potionHeal: 0,
      enemyCoins: 0,
      healthPotDrops: 0,
      regen: 0,
      rangeSize: 0,
