      petDamage: 0,
      lifesteal: 0,
      stunChance: 0
    };
    this.abilityMods = {
      pullRadius: 0,
      smashRadius: 0,
      smashDamage: 0,
      netRadius: 0,
      netDuration: 0,
      netDamage: 0
    };
    this.passives = new Set();
    this.abilityUpgrades = new Set();
    this.weaponEvolution = {
      damageBonus: 0,
      abilityId: null,
      completed: false,
      blueprintId: null
    };
    this.pets = [];
    this.rewardHistory = [];
    this.shopHistory = [];
    this.lastReward = null;
    this.reviveAvailable = false;
    this.dashStrikeReady = false;
    this.phoenixBloodAvailable = false;
    this.onGuardTimer = 0;
    this.basicAttackCount = 0;
    this.poisonTrailTimer = 0;
    this.petSpeedBoost = 0;
    this.petDamageBoost = 0;
    this.fairyBuffTimer = 0;
    this.bodyguardState = {
      active: false,
      timer: 0,
      cooldown: 0
    };
    this.petTaunts = [];
  }

  get weapon() {
    return this.secretWeapon ?? this.classWeapon ?? weapons.ironSaber;
  }

  get ability() {
    return this.character.abilityId ? abilities[this.character.abilityId] : null;
  }

  hasUltimateWeapon() {
    return true;
  }

  equippedClassBonus() {
    return !this.secretWeapon;
  }

  hasReward(id) {
    return this.rewardHistory.includes(id);
  }

  rewardCount(id) {
    return this.rewardHistory.filter((rewardId) => rewardId === id).length;
  }

  shopPurchaseCount(id) {
    return this.shopHistory.filter((rewardId) => rewardId === id).length;
  }

  abilityValue(key) {
    return (this.ability?.[key] ?? 0) + (this.abilityMods[key] ?? 0);
  }

  abilityCooldownMax() {
    if (!this.ability) {
      return 0;
    }
    const fairyCooldown = this.fairyBuffTimer > 0 ? 0.2 : 0;
    return this.ability.cooldown * (1 - Math.min(0.65, this.statBonuses.abilityCooldown + fairyCooldown));
  }

  abilityCooldownValue() {
    return this.ability ? this.abilityCooldowns[this.ability.id] ?? 0 : 0;
  }

  setAbilityCooldown(value) {
    if (!this.ability) {
      return;
    }
    this.abilityCooldowns[this.ability.id] = Math.max(0, value);
  }

  extraAbilityCooldownMax() {
    if (this.extraAbilityId === "fireBreath") {
      return 8.5;
    }
    return this.character.classId === "swordsman" ? 7.5 : 6.5;
  }

  weaponCooldown() {
    const lastStandSpeed = this.passives.has("lastStand") && this.hp / this.maxHp < 0.3 ? 0.2 : 0;
    const fairySpeed = this.fairyBuffTimer > 0 ? 0.25 : 0;
    return (this.weapon?.cooldown ?? 0.45) * (1 - Math.min(0.8, this.statBonuses.attackSpeed + lastStandSpeed + fairySpeed));
  }

  attackDamageBonus() {
    if (this.secretWeapon) {
      return 0;
    }
    return (this.weapon?.damageBonus ?? 0) + this.weaponEvolution.damageBonus;
  }

  attackDamage() {
    if (this.weapon?.kind === "nuke") {
      return this.weapon.damage ?? 9999;
    }
    const lastStandDamage = this.passives.has("lastStand") && this.hp / this.maxHp < 0.3 ? 0.2 : 0;
    const fairyDamage = this.fairyBuffTimer > 0 ? 0.45 : 0;
    return this.baseDamage * (1 + this.statBonuses.attackDamage + this.attackDamageBonus() + lastStandDamage + fairyDamage);
  }

  update(dt, input, camera, room, combat) {
    if (this.hp <= 0) {
      this.isMoving = false;
      return;
    }

    this.attackTimer = Math.max(0, this.attackTimer - dt);
    this.dashTimer = Math.max(0, this.dashTimer - dt);
    this.invulnerable = Math.max(0, this.invulnerable - dt);
    for (const abilityId of Object.keys(this.abilityCooldowns)) {
      this.abilityCooldowns[abilityId] = Math.max(0, this.abilityCooldowns[abilityId] - dt);
    }
    this.extraAbilityCooldown = Math.max(0, this.extraAbilityCooldown - dt);
    this.slowed = Math.max(0, this.slowed - dt);
    this.petSpeedBoost = Math.max(0, this.petSpeedBoost - dt);
    this.petDamageBoost = Math.max(0, this.petDamageBoost - dt);
    this.fairyBuffTimer = Math.max(0, this.fairyBuffTimer - dt);
    if (this.fairyBuffTimer > 0 && this.hp < this.maxHp) {
      this.heal(this.maxHp * 0.02 * dt);
    }
    if (this.statBonuses.regen > 0 && this.hp < this.maxHp) {
      this.heal(this.maxHp * this.statBonuses.regen * dt);
    }
    if (this.passives.has("onGuard")) {
      this.onGuardTimer -= dt;
      if (this.onGuardTimer <= 0) {
        this.invulnerable = Math.max(this.invulnerable, 1);
        this.onGuardTimer = 5;
      }
    }
    if (this.passives.has("poisonTrail") && this.isMoving) {
      this.poisonTrailTimer -= dt;
      if (this.poisonTrailTimer <= 0) {
        combat.spawnIcePatch({
          x: this.x,
          y: this.y,
          radius: 42,
          slow: 0,
          life: 1.6,
          damagePerSecond: Math.max(1, this.maxHp * 0.01),
          color: "#5ec28c"
        });
        this.poisonTrailTimer = 0.18;
      }
    }

    const worldMouse = {
      x: input.mouse.x / (camera.scale ?? 1) + camera.x,
      y: input.mouse.y / (camera.scale ?? 1) + camera.y
    };
    this.facing = angleTo(this, worldMouse);

    const move = normalize(
      (input.isDown(this.controls.moveRight) ? 1 : 0) - (input.isDown(this.controls.moveLeft) ? 1 : 0),
      (input.isDown(this.controls.moveDown) ? 1 : 0) - (input.isDown(this.controls.moveUp) ? 1 : 0)
    );
    this.isMoving = move.x !== 0 || move.y !== 0;
    if (this.isMoving) {
      this.lastMove = move;
    }
    this.animationTime += dt;

    if (input.wasPressed(this.controls.dash) && this.dashTimer <= 0) {
      this.dashing = 0.16 * (1 + this.statBonuses.dashDistance);
      this.invulnerable = 0.28 + (this.passives.has("momentumGuard") ? 0.2 : 0);
      this.dashTimer = this.character.dashCooldown * (1 - Math.min(0.55, this.statBonuses.dashCooldown));
      if (this.passives.has("sageDashStrike") || this.passives.has("cleanStrikes")) {
        this.dashStrikeReady = true;
      }
    }

    const slowMultiplier = this.slowed > 0 ? 0.58 : 1;
    const lastStandSpeed = this.passives.has("lastStand") && this.hp / this.maxHp < 0.3 ? 0.15 : 0;
    const fairySpeed = this.fairyBuffTimer > 0 ? 0.25 : 0;
    const speedBonus = 1 + this.statBonuses.moveSpeed + lastStandSpeed + (this.petSpeedBoost > 0 ? 0.2 : 0) + fairySpeed;
    const speed = (this.dashing > 0 ? this.character.dashSpeed : this.character.speed) * speedBonus * slowMultiplier;
    this.dashing = Math.max(0, this.dashing - dt);
    this.x += move.x * speed * dt;
    this.y += move.y * speed * dt;
    for (const obstacle of room.obstacles) {
      pushCircleOutOfRect(this, obstacle);
    }
    this.x = clamp(this.x, room.margin + this.radius, room.width - room.margin - this.radius);
    this.y = clamp(this.y, room.margin + this.radius, room.height - room.margin - this.radius);

    if (!this.game?.stage?.isLobby && input.isDown(this.controls.autoAimAttack) && this.attackTimer <= 0) {
      const targetEnemy = this.nearestEnemy();
      if (targetEnemy) {
        this.facing = angleTo(this, targetEnemy);
        this.attack(combat, targetEnemy);
      } else if (input.wasPressed(this.controls.autoAimAttack)) {
        combat.floatText(this.x, this.y - 42, "No target", "#afa89e");
      }
    }

    if (!this.game?.stage?.isLobby && input.wasPressed(this.controls.ability)) {
      this.tryUseAbility(combat, worldMouse);
    }

    if (this.canMannequinTransform && !this.transformEntry.active && input.wasPressed(this.controls.extraAbility)) {
      this.startMannequinTransform(combat);
    } else {
      this.updateMannequinTransform(dt, input, combat);
    }

    if (!this.game?.stage?.isLobby && !this.canMannequinTransform && input.wasPressed(this.controls.extraAbility)) {
      this.tryUseExtraAbility(combat);
    }

    if (this.abilityState) {
      this.updateAbility(dt, combat);
    }

    this.updateBodyguards(dt, combat);
    this.updatePets(dt, combat);
  }

  startMannequinTransform(combat) {
    this.transformEntry.active = true;
    this.transformEntry.buffer = "";
    this.transformEntry.timer = 2.35;
    combat.floatText(this.x, this.y - 58, "Type swor or arch", "#f6f1e8");
  }

  updateMannequinTransform(dt, input, combat) {
    if (!this.transformEntry.active) {
      return;
    }

    this.transformEntry.timer -= dt;
    for (const typed of input.typedCharacters) {
      if (typed === "backspace") {
        this.transformEntry.buffer = this.transformEntry.buffer.slice(0, -1);
        continue;
      }
      if (/^[a-z]$/.test(typed)) {
        this.transformEntry.buffer = `${this.transformEntry.buffer}${typed}`.slice(0, 4);
      }
    }

    const character = this.transformCharacterFromBuffer();
    if (character) {
      this.transformMannequinInto(character, combat);
      return;
    }

    if (this.transformEntry.timer <= 0) {
      const typed = this.transformEntry.buffer || "...";
      this.transformEntry.active = false;
      this.transformEntry.buffer = "";
      combat.floatText(this.x, this.y - 58, `No form: ${typed}`, "#afa89e");
    }
  }

  transformCharacterFromBuffer() {
    const buffer = this.transformEntry.buffer.toLowerCase();
    if (buffer.length < 4) {
      return null;
    }
    return characters.find((character) => character.id.slice(0, 4) === buffer || character.role.toLowerCase().slice(0, 4) === buffer) ?? null;
  }

  transformMannequinInto(character, combat) {
    const hpRatio = this.maxHp > 0 ? this.hp / this.maxHp : 1;
    this.character = character;
    this.maxHp = character.maxHp;
    this.hp = Math.max(1, Math.min(this.maxHp, Math.round(this.maxHp * hpRatio)));
    this.classWeapon = weapons[character.fixedWeapon] ?? weapons[character.starterWeapons?.[0]] ?? weapons.sparkPistol;
    this.secretWeapon = null;
    this.baseDamage = character.baseDamage ?? this.baseDamage;
    this.abilityState = null;
    this.transformEntry.active = false;
    this.transformEntry.buffer = "";
    this.inventoryMessage = `${character.name} form`;
    this.extraAbilityId = null;
    this.extraAbilityCooldown = 0;
    combat.floatText(this.x, this.y - 64, `${character.role} form`, character.accent);
  }

  tryUseExtraAbility(combat) {
    if (!this.extraAbilityId) {
      combat.floatText(this.x, this.y - 42, "Evolution ability locked", "#afa89e");
      return;
    }
    if (this.extraAbilityCooldown > 0) {
      combat.floatText(this.x, this.y - 42, "Evolution cooling down", "#f2b85b");
      return;
    }

    if (this.extraAbilityId === "guardBreaker") {
      this.facing = Math.atan2(this.lastMove.y, this.lastMove.x);
      const start = { x: this.x, y: this.y };
      const dashDistance = 330;
      this.invulnerable = Math.max(this.invulnerable, 0.55);
      this.x += Math.cos(this.facing) * dashDistance;
      this.y += Math.sin(this.facing) * dashDistance;
      if (this.game?.stage?.room) {
        const room = this.game.stage.room;
        for (const obstacle of room.obstacles) {
          pushCircleOutOfRect(this, obstacle);
        }
        this.x = clamp(this.x, room.margin + this.radius, room.width - room.margin - this.radius);
        this.y = clamp(this.y, room.margin + this.radius, room.height - room.margin - this.radius);
      }
      combat.spawnSlash({
        owner: this,
        x: start.x,
        y: start.y,
        angle: this.facing,
        radius: dashDistance + 82,
        arc: 0.28,
        damage: this.attackDamage() * 2.35,
        knockback: 360,
        life: 0.2,
        classBonus: true
      });
      this.extraAbilityCooldown = this.extraAbilityCooldownMax();
      combat.floatText(this.x, this.y - 58, "Guard Breaker", this.character.accent);
      return;
    }

    if (this.extraAbilityId === "arrowStorm") {
      const target = this.nearestEnemy();
      if (!target) {
        combat.floatText(this.x, this.y - 42, "No target", "#afa89e");
        return;
      }
      const baseAngle = angleTo(this, target);
      for (let i = 0; i < 7; i += 1) {
        const offset = (i - 3) * 0.105;
        combat.spawnProjectile({
          owner: this,
          faction: "player",
          x: this.x + Math.cos(baseAngle + offset) * 28,
          y: this.y + Math.sin(baseAngle + offset) * 28,
          angle: baseAngle + offset,
          speed: 820,
          radius: 7,
          damage: this.attackDamage() * 0.58,
          life: 0.72,
          color: this.character.accent,
          icePatchOnEnd: {
            radius: 74,
            slow: 1.35,
            life: 2.4,
            color: this.character.accent
          }
        });
      }
      combat.spawnIcePatch({
        x: target.x,
        y: target.y,
        radius: 112,
        slow: 1.7,
        life: 3.3,
        color: this.character.accent
      });
      this.extraAbilityCooldown = this.extraAbilityCooldownMax();
      combat.floatText(target.x, target.y - 58, "Arrow Storm", this.character.accent);
      return;
    }

    if (this.extraAbilityId === "fireBreath") {
      const target = this.nearestEnemy();
      const baseAngle = target ? angleTo(this, target) : Math.atan2(this.lastMove.y, this.lastMove.x);
      this.facing = baseAngle;
      for (let i = -4; i <= 4; i += 1) {
        const angle = baseAngle + i * 0.11;
        combat.spawnProjectile({
          owner: this,
          faction: "player",
          x: this.x + Math.cos(angle) * 32,
          y: this.y + Math.sin(angle) * 32,
          angle,
          speed: 700,
          radius: 12,
          damage: this.attackDamage() * 0.72,
          life: 0.62,
          color: "#ef7d57",
          burn: {
            duration: 3.2,
            rate: 0.012
          }
        });
      }
      this.extraAbilityCooldown = this.extraAbilityCooldownMax();
      combat.floatText(this.x, this.y - 58, "Fire Breath", "#ef7d57");
    }
  }

  attack(combat, target) {
    const weapon = this.weapon;
    this.basicAttackCount += 1;
    const comboBonus = this.passives.has("combo") && this.basicAttackCount % 5 === 0 ? 1 : 0;
    const damage = this.attackDamage() * (this.dashStrikeReady ? 1.3 : 1) * (1 + comboBonus);
    this.attackTimer = this.weaponCooldown();
    const rangeSize = 1 + this.statBonuses.rangeSize;

    if (weapon.kind === "nuke") {
      this.fireNuke(combat);
      this.dashStrikeReady = false;
      return;
    }

    if (weapon.kind === "melee") {
      combat.spawnSlash({
        owner: this,
        x: this.x,
        y: this.y,
        angle: this.facing,
        radius: weapon.range * rangeSize,
        arc: weapon.arc,
        damage,
        knockback: weapon.knockback,
        life: weapon.slashLife ?? 0.12,
        classBonus: !this.secretWeapon,
        hitAllInRange: weapon.hitAllInRange ?? false,
        slashStyle: weapon.slashStyle,
        color: weapon.slashColor,
        accent: weapon.slashAccent,
        hitTextColor: weapon.hitTextColor
      });
      this.dashStrikeReady = false;
      return;
    }

    const count = weapon.projectileCount ?? 1;
    const spread = weapon.spread ?? 0;
    for (let i = 0; i < count; i += 1) {
      const offset = count === 1 ? 0 : (i - (count - 1) / 2) * spread;
      combat.spawnProjectile({
        owner: this,
        faction: "player",
        x: this.x + Math.cos(this.facing) * 28,
        y: this.y + Math.sin(this.facing) * 28,
        angle: this.facing + offset + (Math.random() - 0.5) * spread * 0.2,
        speed: weapon.projectileSpeed * (1 + this.statBonuses.projectileSpeed),
        radius: (weapon.rarity === "rare" ? 9 : 7) * rangeSize,
        damage,
        life: weapon.projectileLife,
        slow: weapon.slow ?? 0,
        sprite: weapon.id === "elmLongbow" && this.character.classId === "archer" && !this.secretWeapon ? "iceArrow" : null,
        color: this.secretWeapon ? "#f2b85b" : this.character.accent
      });
    }
    this.dashStrikeReady = false;
  }

  nearestEnemy() {
    if (!this.game) {
      return null;
    }

    let best = null;
    let bestDistance = Infinity;
    for (const enemy of this.game.enemies) {
      if (enemy.hp <= 0) {
        continue;
      }
      const dist = distance(this, enemy);
      if (dist < bestDistance) {
        best = enemy;
        bestDistance = dist;
      }
    }
    return best;
  }

  fireNuke(combat) {
    if (!this.game) {
      return;
    }

    let hitCount = 0;
    for (const enemy of this.game.enemies) {
      if (enemy.hp > 0) {
        enemy.hp = 0;
        hitCount += 1;
        combat.floatText(enemy.x, enemy.y - enemy.radius, "NUKED", "#f2b85b");
      }
    }

    combat.screenShake = Math.max(combat.screenShake, hitCount > 0 ? 28 : 10);
    combat.floatText(this.x, this.y - 62, hitCount > 0 ? "Room erased" : "No targets", "#f2b85b");
  }

  tryUseAbility(combat, target) {
    if (!this.ability) {
      combat.floatText(this.x, this.y - 42, "No class ability", "#afa89e");
      return;
    }
    if (this.abilityCooldownValue() > 0) {
      combat.floatText(this.x, this.y - 42, "Cooling down", "#f2b85b");
      return;
    }

    const ability = this.ability;
    this.setAbilityCooldown(this.abilityCooldownMax());

    if (ability.id === "whirlwindSmash") {
      this.abilityState = {
        id: ability.id,
        timer: this.abilityValue("duration"),
        total: this.abilityValue("duration"),
        smashed: false
      };
      combat.floatText(this.x, this.y - 52, "Whirlwind!", this.character.accent);
      return;
    }

    if (ability.id === "giantNet") {
      const target = this.nearestEnemy();
      if (target) {
        this.facing = angleTo(this, target);
      }
      combat.spawnNet({
        owner: this,
        x: this.x + Math.cos(this.facing) * 32,
        y: this.y + Math.sin(this.facing) * 32,
        angle: this.facing,
        speed: this.abilityValue("projectileSpeed"),
        radius: this.abilityValue("projectileRadius"),
        netRadius: this.abilityValue("netRadius"),
        netDuration: this.abilityValue("netDuration"),
        damage: this.abilityValue("netDamage"),
        color: this.character.accent,
        thornBurst: this.abilityUpgrades.has("netThorns")
      });
      combat.floatText(this.x, this.y - 52, "Net launched!", this.character.accent);
    }
  }

  updateAbility(dt, combat) {
    const ability = this.ability;
    this.abilityState.timer -= dt;

    if (this.abilityState.id === "whirlwindSmash") {
      combat.pullEnemies(this, this.abilityValue("pullRadius"), ability.pullStrength, dt);
      if (this.abilityState.timer <= 0 && !this.abilityState.smashed) {
        this.abilityState.smashed = true;
        combat.areaDamage(this, this.abilityValue("smashRadius"), this.abilityValue("smashDamage"), 420);
        if (this.abilityUpgrades.has("whirlwindBlades")) {
          this.fireWhirlwindBlades(combat);
        }
        combat.screenShake = Math.max(combat.screenShake, 12);
      }
    }

    if (this.abilityState.timer <= -0.05) {
      this.abilityState = null;
    }
  }

  fireWhirlwindBlades(combat) {
    for (let i = 0; i < 8; i += 1) {
      combat.spawnProjectile({
        owner: this,
        faction: "player",
        x: this.x,
        y: this.y,
        angle: (Math.PI * 2 * i) / 8,
        speed: 620,
        radius: 8,
        damage: 22 * (1 + this.statBonuses.attackDamage),
        life: 0.62,
        color: this.character.accent
      });
    }
  }

  updatePets(dt, combat) {
    this.petTaunts = this.petTaunts.filter((taunt) => taunt.timer > 0);
    for (const taunt of this.petTaunts) {
      taunt.timer -= dt;
    }

    if (!this.game || this.pets.length === 0) {
      return;
    }

    for (let i = 0; i < this.pets.length; i += 1) {
      const pet = this.pets[i];
      this.updatePetMovement(pet, i, dt);
      pet.cooldown = Math.max(0, pet.cooldown - dt);
      if (pet.fairyAuraCooldown !== undefined) {
        pet.fairyAuraCooldown = Math.max(0, pet.fairyAuraCooldown - dt);
        if (pet.fairyAuraCooldown <= 0) {
          this.fairyBuffTimer = Math.max(this.fairyBuffTimer, 5);
          this.petDamageBoost = Math.max(this.petDamageBoost, 5);
          this.petSpeedBoost = Math.max(this.petSpeedBoost, 5);
          this.heal(Math.max(4, this.maxHp * 0.08));
          this.invulnerable = Math.max(this.invulnerable, 0.6);
          combat.floatText(this.x, this.y - 96, "Fairy blessing", pet.color);
          pet.fairyAuraCooldown = 6;
        }
      }
      if (pet.speedPulse) {
        pet.speedPulseCooldown = Math.max(0, (pet.speedPulseCooldown ?? 0) - dt);
        if (pet.speedPulseCooldown <= 0) {
          this.petSpeedBoost = Math.max(this.petSpeedBoost, 2.5);
          combat.floatText(this.x, this.y - 72, "Bird speed", pet.color);
          pet.speedPulseCooldown = 7;
        }
      }
      if (pet.tauntCooldown !== undefined) {
        pet.tauntCooldown = Math.max(0, pet.tauntCooldown - dt);
        if (pet.tauntCooldown <= 0) {
          this.petTaunts.push({
            x: pet.x,
            y: pet.y,
            radius: 90,
            timer: 3,
            hp: 1,
            takeDamage: () => false
          });
          combat.floatText(pet.x, pet.y - 24, "Taunt", pet.color);
          pet.tauntCooldown = 8;
        }
      }

      if (pet.cooldown > 0) {
        continue;
      }

      const target = this.game.enemies
        .filter((enemy) => enemy.hp > 0 && distance(pet, enemy) < 520)
        .sort((a, b) => distance(pet, a) - distance(pet, b))[0];
      if (!target) {
        continue;
      }

      combat.spawnProjectile({
        owner: this,
        petId: pet.id,
        faction: "player",
        x: pet.x,
        y: pet.y,
        angle: angleTo(pet, target),
        speed: 680,
        radius: 6,
        damage: this.petDamage(pet),
        life: 0.75,
        slow: pet.id === "epicFish" || pet.id === "companionSpark" ? pet.slow ?? 0 : 0,
        poison: pet.id === "epicSnake" ? pet.poison : null,
        bleed: pet.id === "epicTiger" ? pet.bleed : null,
        color: pet.color
      });
      pet.cooldown = pet.cooldownMax ?? 1.05;
    }
  }

  updatePetMovement(pet, index, dt) {
    pet.angle += dt * (1.7 + index * 0.18);

    if (!pet.freeMove) {
      pet.x = this.x + Math.cos(pet.angle + index * 2.1) * 48;
      pet.y = this.y + Math.sin(pet.angle + index * 2.1) * 34;
      return;
    }

    if (pet.x === undefined || pet.y === undefined) {
      pet.x = this.x + Math.cos(pet.angle + index) * 58;
      pet.y = this.y + Math.sin(pet.angle + index) * 44;
      pet.roamAngle = pet.angle;
      pet.roamTimer = 0;
    }

    const target = this.petMoveTarget(pet);
    const desiredDistance = target.enemy ? 145 : 56 + (index % 4) * 18;
    const currentDistance = distance(pet, target);
    const shouldMove = target.enemy ? currentDistance > desiredDistance : currentDistance > desiredDistance + 18;
    if (shouldMove) {
      const dir = normalize(target.x - pet.x, target.y - pet.y);
      const speed = pet.bodyguard ? 255 : pet.id === "epicBird" || pet.id === "mythicalFairy" ? 285 : pet.id === "epicTortoise" ? 190 : 235;
      pet.x += dir.x * speed * dt;
      pet.y += dir.y * speed * dt;
      pet.facing = Math.atan2(dir.y, dir.x);
      this.keepPetInRoom(pet);
      return;
    }

    pet.roamTimer = Math.max(0, (pet.roamTimer ?? 0) - dt);
    if (pet.roamTimer <= 0) {
      pet.roamAngle = Math.random() * Math.PI * 2;
      pet.roamTimer = 0.8 + Math.random() * 1.2;
    }
    const driftSpeed = target.enemy ? 38 : 24;
    pet.x += Math.cos(pet.roamAngle) * driftSpeed * dt;
    pet.y += Math.sin(pet.roamAngle) * driftSpeed * dt;
    this.keepPetInRoom(pet);
  }

  petMoveTarget(pet) {
    const enemy = this.game?.enemies
      ?.filter((candidate) => candidate.hp > 0 && distance(pet, candidate) < 620)
      .sort((a, b) => distance(pet, a) - distance(pet, b))[0];
    if (enemy) {
      return { ...enemy, enemy: true };
    }

    const homeAngle = (pet.angle ?? 0) + (pet.bodyguard ? 1.6 : 0);
    return {
      x: this.x + Math.cos(homeAngle) * 70,
      y: this.y + Math.sin(homeAngle) * 48,
      enemy: false
    };
  }

  keepPetInRoom(pet) {
    const room = this.game?.stage?.room;
    if (!room) {
      return;
    }
    const radius = 16;
    pet.x = clamp(pet.x, room.margin + radius, room.width - room.margin - radius);
    pet.y = clamp(pet.y, room.margin + radius, room.height - room.margin - radius);
  }

  petDamage(pet) {
    if (pet.bodyguard) {
      return this.attackDamage() * (pet.damageRatio ?? 0.3) * (1 + this.statBonuses.petDamage + (this.petDamageBoost > 0 ? 0.6 : 0));
    }
    return (pet.damage ?? 12) * (1 + this.statBonuses.attackDamage + this.statBonuses.petDamage + (this.petDamageBoost > 0 ? 0.6 : 0));
  }

  updateBodyguards(dt, combat) {
    if (!this.passives.has("bodyguards")) {
      return;
    }

    if (this.bodyguardState.active) {
      this.bodyguardState.timer -= dt;
      if (this.bodyguardState.timer <= 0) {
        this.pets = this.pets.filter((pet) => !pet.bodyguard);
        this.bodyguardState.active = false;
        this.bodyguardState.cooldown = 10;
        combat.floatText(this.x, this.y - 76, "Bodyguards fade", "#afa89e");
      }
      return;
    }

    this.bodyguardState.cooldown = Math.max(0, this.bodyguardState.cooldown - dt);
    if (this.bodyguardState.cooldown > 0) {
      return;
    }

    const upgrades = this.rewardCount("bodyguards2");
    const count = 2 + upgrades * 2;
    const damageRatio = 0.3 + upgrades * 0.1;
    this.pets = this.pets.filter((pet) => !pet.bodyguard);
    for (let i = 0; i < count; i += 1) {
      this.pets.push({
        id: `bodyguard-${i}`,
        name: "Bodyguard",
        bodyguard: true,
        freeMove: true,
        angle: (Math.PI * 2 * i) / count,
        cooldown: 0.2 + i * 0.08,
        cooldownMax: 0.95,
        color: "#afa89e",
        damageRatio
      });
    }
    this.bodyguardState.active = true;
    this.bodyguardState.timer = 10;
    combat.floatText(this.x, this.y - 76, "Bodyguards summoned", "#afa89e");
  }

  takeDamage(amount) {
    if (this.hp <= 0) {
      return false;
    }

    if (this.character.classId === "swordsman" && this.abilityState?.id === "whirlwindSmash") {
      return false;
    }

    if (this.invulnerable > 0) {
      return false;
    }
    const fairyReduction = this.fairyBuffTimer > 0 ? 0.25 : 0;
    const damageTaken = amount * (1 - Math.min(0.75, this.statBonuses.damageReduction + fairyReduction)) * (this.passives.has("poisonTrail") ? 1.1 : 1);
    this.hp = Math.max(0, this.hp - damageTaken);
    if (this.hp > 0 && this.passives.has("phoenixBlood") && this.phoenixBloodAvailable && this.hp / this.maxHp < 0.35) {
      this.phoenixBloodAvailable = false;
      this.heal(this.maxHp * 0.1);
    }
    if (this.hp <= 0 && this.reviveAvailable) {
      this.reviveAvailable = false;
      this.hp = Math.ceil(this.maxHp * 0.45);
      this.invulnerable = 1.2;
      return false;
    }
    this.invulnerable = 0.45;
    return true;
  }

  equipWeapon(weapon) {
    const oldWeapon = this.weapon;
    this.secretWeapon = weapon;
    this.inventoryMessage = `${weapon.name} armed`;
    return oldWeapon;
  }

  heal(amount) {
    const before = this.hp;
    this.hp = Math.min(this.maxHp, this.hp + amount);
    return this.hp - before;
  }

  setCharacter(character) {
    this.character = character;
    this.radius = 24;
    this.hp = character.maxHp;
    this.maxHp = character.maxHp;
    this.classWeapon = weapons[character.fixedWeapon] ?? weapons.sparkPistol;
    this.secretWeapon = null;
    this.baseDamage = character.baseDamage ?? 1;
    this.attackTimer = 0;
    this.dashTimer = 0;
    this.dashing = 0;
    this.invulnerable = 0;
    this.abilityCooldowns = {};
    this.abilityState = null;
    this.extraAbilityId = null;
    this.extraAbilityCooldown = 0;
    this.canMannequinTransform = character.id === "mannequin";
    this.transformEntry = {
      active: false,
      buffer: "",
      timer: 0
    };
    this.inventoryMessage = `${character.name} selected`;
    this.slowed = 0;
    this.statBonuses = {
      attackDamage: 0,
      attackSpeed: 0,
      moveSpeed: 0,
      dashCooldown: 0,
      abilityCooldown: 0,
      dashDistance: 0,
      projectileSpeed: 0,
      damageReduction: 0,
      potionHeal: 0,
      enemyCoins: 0,
      healthPotDrops: 0,
      regen: 0,
      rangeSize: 0,
      petDamage: 0,
      lifesteal: 0,
      stunChance: 0
    };
    this.abilityMods = {
      pullRadius: 0,
      smashRadius: 0,
      smashDamage: 0,
      netRadius: 0,
      netDuration: 0,
      netDamage: 0
    };
    this.passives = new Set();
    this.abilityUpgrades = new Set();
    this.weaponEvolution = {
      damageBonus: 0,
      abilityId: null,
      completed: false,
      blueprintId: null
    };
    this.pets = [];
    this.rewardHistory = [];
    this.shopHistory = [];
    this.lastReward = null;
    this.reviveAvailable = false;
    this.dashStrikeReady = false;
    this.phoenixBloodAvailable = false;
    this.onGuardTimer = 0;
    this.basicAttackCount = 0;
    this.poisonTrailTimer = 0;
    this.petSpeedBoost = 0;
    this.petDamageBoost = 0;
    this.fairyBuffTimer = 0;
    this.bodyguardState = {
      active: false,
      timer: 0,
      cooldown: 0
    };
    this.petTaunts = [];
  }
}



// src/renderer.js

class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.dpr = 1;
    this.worldScale = 1;
    this.sprites = loadSpriteImages(spriteSheets);
    this.resize();
    window.addEventListener("resize", () => this.resize());
  }

  resize() {
    this.dpr = 1;
    const width = Math.floor(window.innerWidth);
    const height = Math.floor(window.innerHeight);
    this.canvas.width = width;
    this.canvas.height = height;
    this.worldScale = this.calculateWorldScale(width, height);
  }

  calculateWorldScale(width, height) {
    if (width >= 980 && height >= 620) {
      return 1;
    }
    return Math.max(0.38, Math.min(1, width / 1180, height / 680));
  }

  render(game) {
    const ctx = this.ctx;
    ctx.imageSmoothingEnabled = false;
    const camera = game.camera;
    const shake = game.combat.screenShake;
    const sx = shake ? (Math.random() - 0.5) * shake : 0;
    const sy = shake ? (Math.random() - 0.5) * shake : 0;

    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(this.worldScale, this.worldScale);
    ctx.translate(-camera.x, -camera.y);
    this.drawRoom(ctx, game.stage);
    this.drawQuestTorches(ctx, game.stage);
    this.drawLoot(ctx, game.loot);
    this.drawIcePatches(ctx, game.combat.icePatches);
    this.drawNets(ctx, game.combat.nets);
    this.drawProjectiles(ctx, game.combat.projectiles);
    this.drawProjectiles(ctx, game.combat.enemyProjectiles);
    this.drawSlashes(ctx, game.combat.slashes);
    for (const enemy of game.enemies) {
      this.drawEnemy(ctx, enemy);
    }
    for (const player of game.players) {
      this.drawPets(ctx, player.pets);
    }
    for (const player of game.players) {
      this.drawPlayer(ctx, player);
    }
    this.drawFloaters(ctx, game.combat.floaters);
    this.drawSpeechBubbles(ctx, game.combat.speechBubbles);
    this.drawQuestFog(ctx, game);
    ctx.restore();

    this.drawHud(ctx, game);
    this.drawRewardChoices(ctx, game);
  }

  drawEllipse(ctx, x, y, radiusX, radiusY, rotation = 0, startAngle = 0, endAngle = Math.PI * 2) {
    if (typeof ctx.ellipse === "function") {
      ctx.ellipse(x, y, radiusX, radiusY, rotation, startAngle, endAngle);
      return;
    }

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);
    ctx.scale(radiusX, radiusY);
    ctx.arc(0, 0, 1, startAngle, endAngle);
    ctx.restore();
  }

  drawRoundRect(ctx, x, y, width, height, radius) {
    if (typeof ctx.roundRect === "function") {
      ctx.roundRect(x, y, width, height, radius);
      return;
    }

    const r = Math.min(radius, width / 2, height / 2);
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + width - r, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + r);
    ctx.lineTo(x + width, y + height - r);
    ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
    ctx.lineTo(x + r, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
  }

  drawRoom(ctx, stage) {
    const { room } = stage;
    ctx.fillStyle = stage.theme.floor;
    ctx.fillRect(0, 0, room.width, room.height);

    ctx.fillStyle = stage.theme.tile;
    for (let x = room.margin; x < room.width - room.margin; x += 96) {
      for (let y = room.margin; y < room.height - room.margin; y += 96) {
        ctx.fillRect(x + 2, y + 2, 90, 90);
      }
    }

    ctx.strokeStyle = stage.isBoss ? "#a747d9" : stage.theme.wall;
    ctx.lineWidth = 12;
    ctx.strokeRect(room.margin - 20, room.margin - 20, room.width - room.margin * 2 + 40, room.height - room.margin * 2 + 40);

    ctx.fillStyle = "rgba(255, 255, 255, 0.06)";
    for (let i = 0; i < 18; i += 1) {
      const x = room.margin + ((i * 167) % (room.width - room.margin * 2));
      const y = room.margin + ((i * 103) % (room.height - room.margin * 2));
      ctx.fillRect(x, y, 38, 14);
    }

    for (const obstacle of room.obstacles) {
      ctx.fillStyle = stage.theme.obstacle;
      ctx.fillRect(obstacle.x, obstacle.y, obstacle.w, obstacle.h);
      ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
      ctx.fillRect(obstacle.x + 8, obstacle.y + 8, obstacle.w - 16, 8);
      ctx.strokeStyle = "rgba(0, 0, 0, 0.35)";
      ctx.lineWidth = 3;
      ctx.strokeRect(obstacle.x, obstacle.y, obstacle.w, obstacle.h);
    }
  }

  drawPlayer(ctx, player) {
    if (player.hp <= 0) {
      this.drawDownedPlayer(ctx, player);
      return;
    }

    if (this.drawPlayerSprite(ctx, player)) {
      this.drawPlayerAbilityEffects(ctx, player);
      this.drawPlayerLabel(ctx, player);
      return;
    }

    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.facing);

    if (player.invulnerable > 0) {
      ctx.globalAlpha = 0.62 + Math.sin(performance.now() / 45) * 0.22;
    }

    ctx.fillStyle = player.character.color;
    ctx.beginPath();
    ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = player.character.accent;
    ctx.beginPath();
    ctx.moveTo(player.radius + 12, 0);
    ctx.lineTo(5, -10);
    ctx.lineTo(5, 10);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "#0d1013";
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.restore();

    this.drawPlayerAbilityEffects(ctx, player);
    this.drawPlayerLabel(ctx, player);
  }

  drawDownedPlayer(ctx, player) {
    ctx.save();
    ctx.globalAlpha = 0.52;
    ctx.fillStyle = player.character.color;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#101317";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(player.x - 12, player.y - 12);
    ctx.lineTo(player.x + 12, player.y + 12);
    ctx.moveTo(player.x + 12, player.y - 12);
    ctx.lineTo(player.x - 12, player.y + 12);
    ctx.stroke();
    ctx.restore();
    this.drawPlayerLabel(ctx, player);
  }

  drawPlayerLabel(ctx, player) {
    ctx.save();
    ctx.textAlign = "center";
    ctx.font = "900 12px ui-sans-serif, system-ui";
    ctx.fillStyle = player.playerIndex === 1 ? "#73a9ff" : "#f2b85b";
    ctx.fillText(player.label, player.x, player.y - player.radius - 36);
    ctx.restore();
  }

  drawPets(ctx, pets) {
    for (const pet of pets) {
      if (pet.x === undefined || pet.y === undefined) {
        continue;
      }
      ctx.fillStyle = "rgba(0, 0, 0, 0.28)";
      ctx.beginPath();
      this.drawEllipse(ctx, pet.x, pet.y + 12, 13, 5);
      ctx.fill();
      ctx.fillStyle = pet.color;
      ctx.beginPath();
      ctx.arc(pet.x, pet.y, 10 + Math.sin(performance.now() / 160) * 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#f6f1e8";
      ctx.beginPath();
      ctx.arc(pet.x + 3, pet.y - 3, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }


  drawPlayerSprite(ctx, player) {
    const sheet = this.sprites[player.character.id];
    if (!sheet?.loaded) {
      return false;
    }

    const animationName = this.playerAnimationName(player);
    const animation = sheet.animations[animationName] ?? sheet.animations.idle;
    const frame = Math.floor(player.animationTime * animation.fps) % animation.frames;
    const sourceX = frame * sheet.frameWidth;
    const sourceY = animation.row * sheet.frameHeight;
    const drawX = Math.round(player.x - sheet.drawWidth / 2);
    const drawY = Math.round(player.y - sheet.drawHeight / 2 - 4);
    const facingLeft = Math.cos(player.facing) < -0.12;

    ctx.save();
    if (player.invulnerable > 0 || player.abilityState?.id === "whirlwindSmash") {
      ctx.globalAlpha = 0.76 + Math.sin(performance.now() / 45) * 0.18;
    }

    ctx.fillStyle = "rgba(0, 0, 0, 0.34)";
    ctx.beginPath();
    this.drawEllipse(ctx, player.x, player.y + 24, 24, 8);
    ctx.fill();

    if (facingLeft) {
      ctx.translate(player.x, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(
        sheet.image,
        sourceX,
        sourceY,
        sheet.frameWidth,
        sheet.frameHeight,
        Math.round(-sheet.drawWidth / 2),
        drawY,
        sheet.drawWidth,
        sheet.drawHeight
      );
    } else {
      ctx.drawImage(
        sheet.image,
        sourceX,
        sourceY,
        sheet.frameWidth,
        sheet.frameHeight,
        drawX,
        drawY,
        sheet.drawWidth,
        sheet.drawHeight
      );
    }

    ctx.restore();
    return true;
  }

  playerAnimationName(player) {
    if (player.abilityState?.id === "whirlwindSmash") {
      return "whirlwind";
    }
    if (player.invulnerable > 0 && player.hp < player.maxHp) {
      return "hurt";
    }
    if (player.attackTimer > Math.max(0, player.weaponCooldown() - 0.18)) {
      return "attack";
    }
    if (player.isMoving) {
      return "walk";
    }
    return "idle";
  }

  drawPlayerAbilityEffects(ctx, player) {
    if (player.abilityState?.id !== "whirlwindSmash") {
      return;
    }

    const progress = 1 - player.abilityState.timer / player.abilityState.total;
    ctx.strokeStyle = `rgba(242, 184, 91, ${0.75 - progress * 0.2})`;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.abilityValue("pullRadius") * (0.72 + progress * 0.22), progress * 9, progress * 9 + Math.PI * 1.45);
    ctx.stroke();
  }

  drawEnemy(ctx, enemy) {
    const usedSprite = this.drawEnemySprite(ctx, enemy);
    if (usedSprite) {
      this.drawEnemyStatus(ctx, enemy);
      return;
    }

    ctx.save();
    ctx.translate(enemy.x, enemy.y);
    ctx.rotate(enemy.angle || 0);

    ctx.fillStyle = enemy.frozen > 0 ? "#73a9ff" : enemy.color;
    ctx.beginPath();
    ctx.arc(0, 0, enemy.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#101317";
    ctx.beginPath();
    ctx.arc(enemy.radius * 0.38, -enemy.radius * 0.24, enemy.radius * 0.14, 0, Math.PI * 2);
    ctx.arc(enemy.radius * 0.38, enemy.radius * 0.24, enemy.radius * 0.14, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    this.drawEnemyStatus(ctx, enemy);
  }

  drawEnemyStatus(ctx, enemy) {
    const barWidth = enemy.radius * 2.2;
    ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
    ctx.fillRect(enemy.x - barWidth / 2, enemy.y - enemy.radius - 16, barWidth, 6);
    ctx.fillStyle = enemy.type === "boss" ? "#a747d9" : "#d95757";
    ctx.fillRect(enemy.x - barWidth / 2, enemy.y - enemy.radius - 16, barWidth * Math.max(0, enemy.hp / enemy.maxHp), 6);

    if (enemy.specialCooldown < 0.25 && (enemy.type === "brute" || enemy.type === "ranger" || enemy.type === "boss")) {
      ctx.strokeStyle = "#f2b85b";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(enemy.x, enemy.y, enemy.radius + 8, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (enemy.regenerating) {
      ctx.strokeStyle = "#5ec28c";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(enemy.x, enemy.y, enemy.radius + 16, -Math.PI / 2, Math.PI * 1.5);
      ctx.stroke();
    }

    if (enemy.bossKind === "dragon") {
      const shieldActive = (enemy.dragonShieldDown ?? 0) <= 0;
      ctx.strokeStyle = shieldActive ? "#f2b85b" : "#73a9ff";
      ctx.lineWidth = shieldActive ? 5 : 4;
      ctx.beginPath();
      ctx.arc(enemy.x, enemy.y, enemy.radius + 22, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = shieldActive ? "#f2b85b" : "#73a9ff";
      ctx.font = "900 13px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText(shieldActive ? "80% SHIELD" : "STUNNED", enemy.x, enemy.y - enemy.radius - 26);
      ctx.textAlign = "start";
    }

    if (enemy.state === "windup") {
      ctx.strokeStyle = "#f2b85b";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(enemy.x, enemy.y, enemy.radius + 13 + Math.sin(performance.now() / 60) * 3, 0, Math.PI * 2);
      ctx.stroke();
    } else if (!enemy.alert && enemy.type !== "boss") {
      ctx.fillStyle = "rgba(246, 241, 232, 0.55)";
      ctx.font = "800 16px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText("?", enemy.x, enemy.y - enemy.radius - 24);
      ctx.textAlign = "start";
    }
  }

  drawEnemySprite(ctx, enemy) {
    const spriteId = enemy.bossKind === "broadcaster" ? "bossBroadcaster" : null;
    if (!spriteId) {
      return false;
    }

    const sheet = this.sprites[spriteId];
    if (!sheet?.loaded) {
      return false;
    }

    const animationName = this.enemyAnimationName(enemy);
    const animation = sheet.animations[animationName] ?? sheet.animations.idle;
    const frame = Math.floor(performance.now() / 1000 * animation.fps) % animation.frames;
    const sourceX = frame * sheet.frameWidth;
    const sourceY = animation.row * sheet.frameHeight;
    const drawX = Math.round(enemy.x - sheet.drawWidth / 2);
    const drawY = Math.round(enemy.y - sheet.drawHeight / 2 - 6);

    ctx.save();
    ctx.fillStyle = "rgba(0, 0, 0, 0.34)";
    ctx.beginPath();
    this.drawEllipse(ctx, enemy.x, enemy.y + 28, 28, 9);
    ctx.fill();
    ctx.drawImage(sheet.image, sourceX, sourceY, sheet.frameWidth, sheet.frameHeight, drawX, drawY, sheet.drawWidth, sheet.drawHeight);
    ctx.restore();
    return true;
  }

  enemyAnimationName(enemy) {
    if (enemy.state === "windup") {
      if (enemy.nextAction === "micDrop") return "micDrop";
      if (enemy.nextAction === "table") return "table";
      if (enemy.nextAction === "phone") return "phone";
      if (enemy.nextAction === "liveStream") return "liveStream";
    }
    if (enemy.shieldTimer > 0) return "table";
    if (enemy.spriteAction && enemy.spriteAction !== "idle") return enemy.spriteAction;
    return enemy.state === "chase" ? "walk" : "idle";
  }

  drawProjectiles(ctx, projectiles) {
    for (const projectile of projectiles) {
      if (projectile.sprite === "iceArrow") {
        this.drawIceArrowProjectile(ctx, projectile);
        continue;
      }
      ctx.fillStyle = projectile.color;
      ctx.beginPath();
      ctx.arc(projectile.x, projectile.y, projectile.radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  drawIceArrowProjectile(ctx, projectile) {
    ctx.save();
    ctx.translate(projectile.x, projectile.y);
    ctx.rotate(projectile.angle);

    const length = Math.max(58, projectile.radius * 8.5);
    const shaftLength = length * 0.58;
    const headX = length * 0.42;
    const tailX = -length * 0.48;

    ctx.shadowColor = "rgba(115, 201, 255, 0.86)";
    ctx.shadowBlur = 12;
    ctx.strokeStyle = "rgba(104, 196, 255, 0.38)";
    ctx.lineWidth = 16;
    ctx.beginPath();
    ctx.moveTo(tailX + 8, 0);
    ctx.lineTo(headX + 12, 0);
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = "#101317";
    ctx.lineCap = "square";
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(tailX + 18, 0);
    ctx.lineTo(headX, 0);
    ctx.stroke();

    ctx.strokeStyle = "#9fd9ff";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(tailX + 20, 0);
    ctx.lineTo(headX + 2, 0);
    ctx.stroke();

    ctx.fillStyle = "#143b78";
    ctx.strokeStyle = "#d8f2ff";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(headX - 2, 0);
    ctx.lineTo(headX + 28, -17);
    ctx.lineTo(headX + 48, 0);
    ctx.lineTo(headX + 28, 17);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#64d8ff";
    ctx.beginPath();
    ctx.moveTo(headX + 10, 0);
    ctx.lineTo(headX + 27, -8);
    ctx.lineTo(headX + 35, 0);
    ctx.lineTo(headX + 27, 8);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#1a4ba2";
    ctx.strokeStyle = "#d8f2ff";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(tailX, 0);
    ctx.lineTo(tailX - 34, -21);
    ctx.lineTo(tailX - 18, -3);
    ctx.lineTo(tailX - 34, 21);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = "#8bd8ff";
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i += 1) {
      const x = tailX - 24 + i * 8;
      ctx.beginPath();
      ctx.moveTo(x, -15 + i * 3);
      ctx.lineTo(x + 16, -2);
      ctx.moveTo(x, 15 - i * 3);
      ctx.lineTo(x + 16, 2);
      ctx.stroke();
    }

    ctx.strokeStyle = "rgba(115, 201, 255, 0.62)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(-6, 0, 19, -0.82, 0.82);
    ctx.arc(-10, 0, 27, 2.32, 3.96);
    ctx.stroke();

    ctx.restore();
  }

  drawSlashes(ctx, slashes) {
    for (const slash of slashes) {
      if (slash.slashStyle === "redSaber") {
        this.drawRedSaberSlash(ctx, slash);
        continue;
      }

      ctx.save();
      ctx.translate(slash.x, slash.y);
      ctx.rotate(slash.angle);
      ctx.strokeStyle = slash.classBonus ? "rgba(242, 184, 91, 0.85)" : "rgba(246, 241, 232, 0.78)";
      ctx.lineWidth = 16;
      ctx.beginPath();
      ctx.arc(0, 0, slash.radius, -slash.arc / 2, slash.arc / 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  drawRedSaberSlash(ctx, slash) {
    const lifeRatio = Math.max(0, Math.min(1, slash.life / (slash.totalLife ?? slash.life)));
    const progress = 1 - lifeRatio;
    const sparkRadius = slash.radius + 5 + progress * 10;
    const startAngle = slash.arc >= Math.PI * 2 ? 0 : -slash.arc / 2;
    const endAngle = slash.arc >= Math.PI * 2 ? Math.PI * 2 : slash.arc / 2;

    ctx.save();
    ctx.translate(slash.x, slash.y);
    ctx.rotate(slash.angle + progress * 0.35);
    ctx.globalCompositeOperation = "lighter";

    ctx.strokeStyle = `rgba(255, 42, 32, ${0.24 * lifeRatio})`;
    ctx.lineWidth = 34;
    ctx.beginPath();
    ctx.arc(0, 0, slash.radius, startAngle, endAngle);
    ctx.stroke();

    ctx.strokeStyle = `rgba(255, 59, 48, ${0.88 * lifeRatio})`;
    ctx.lineWidth = 17;
    ctx.beginPath();
    ctx.arc(0, 0, slash.radius, startAngle, endAngle);
    ctx.stroke();

    ctx.strokeStyle = `rgba(255, 209, 194, ${0.84 * lifeRatio})`;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(0, 0, slash.radius + 1, startAngle, endAngle);
    ctx.stroke();

    ctx.fillStyle = `rgba(255, 132, 91, ${0.78 * lifeRatio})`;
    for (let i = 0; i < 8; i += 1) {
      const angle = -slash.arc / 2 + (slash.arc * i) / 8 + progress * 0.8;
      const sparkLength = 8 + (i % 3) * 4;
      const x = Math.cos(angle) * sparkRadius;
      const y = Math.sin(angle) * sparkRadius;
      ctx.beginPath();
      ctx.ellipse(x, y, sparkLength, 2.2, angle, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  drawNets(ctx, nets) {
    for (const net of nets) {
      ctx.strokeStyle = net.color;
      ctx.lineWidth = net.sprung ? 4 : 3;
      ctx.beginPath();
      ctx.arc(net.x, net.y, net.sprung ? net.netRadius : net.radius, 0, Math.PI * 2);
      ctx.stroke();

      if (net.sprung) {
        ctx.globalAlpha = 0.35;
        for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 5) {
          ctx.beginPath();
          ctx.moveTo(net.x, net.y);
          ctx.lineTo(net.x + Math.cos(angle) * net.netRadius, net.y + Math.sin(angle) * net.netRadius);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
    }
  }

  drawIcePatches(ctx, patches) {
    for (const patch of patches) {
      ctx.save();
      ctx.globalAlpha = Math.max(0.15, Math.min(0.52, patch.life / 4.2));
      ctx.fillStyle = "rgba(115, 169, 255, 0.34)";
      ctx.strokeStyle = patch.color ?? "#73a9ff";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(patch.x, patch.y, patch.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.globalAlpha *= 0.75;
      for (let i = 0; i < 8; i += 1) {
        const angle = (Math.PI * 2 * i) / 8;
        ctx.beginPath();
        ctx.moveTo(patch.x, patch.y);
        ctx.lineTo(patch.x + Math.cos(angle) * patch.radius * 0.85, patch.y + Math.sin(angle) * patch.radius * 0.85);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  drawLoot(ctx, loot) {
    ctx.textAlign = "center";
    for (const item of loot) {
      const bob = Math.sin(item.bob) * 5;
      if (item.type === "portal") {
        ctx.save();
        ctx.translate(item.x, item.y + bob);
        ctx.strokeStyle = item.color;
        ctx.lineWidth = 6;
        ctx.beginPath();
        this.drawEllipse(ctx, 0, 0, 30, 44);
        ctx.stroke();
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = item.color;
        ctx.beginPath();
        this.drawEllipse(ctx, 0, 0, 18, 32);
        ctx.fill();
        ctx.restore();
        continue;
      }

      if (item.type === "questPortal") {
        ctx.save();
        ctx.translate(item.x, item.y + bob);
        ctx.strokeStyle = item.color;
        ctx.lineWidth = 6;
        ctx.beginPath();
        this.drawEllipse(ctx, 0, 0, 34, 48);
        ctx.stroke();
        ctx.rotate(performance.now() / 650);
        ctx.globalAlpha = 0.5;
        ctx.strokeStyle = "#f2b85b";
        ctx.beginPath();
        ctx.arc(0, 0, 20, 0, Math.PI * 1.55);
        ctx.stroke();
        ctx.restore();
        continue;
      }

      if (item.type === "lobbyCharacter") {
        this.drawLobbyCharacter(ctx, item, bob);
        continue;
      }

      if (item.type === "lobbyPortal") {
        this.drawLobbyPortal(ctx, item, bob);
        continue;
      }

      if (item.type === "lobbySpot") {
        this.drawLobbySpot(ctx, item, bob);
        continue;
      }

      if (item.type === "healthPotion") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.42)";
        ctx.beginPath();
        this.drawEllipse(ctx, item.x, item.y + 18, 20, 7);
        ctx.fill();

        ctx.fillStyle = item.color;
        ctx.beginPath();
        this.drawRoundRect(ctx, item.x - 13, item.y - 18 + bob, 26, 34, 7);
        ctx.fill();
        ctx.fillStyle = "#f6f1e8";
        ctx.fillRect(item.x - 7, item.y - 3 + bob, 14, 5);
        ctx.fillRect(item.x - 2, item.y - 8 + bob, 5, 15);
        continue;
      }

      if (item.type === "blueprint") {
        ctx.save();
        ctx.translate(item.x, item.y + bob);
        ctx.fillStyle = "rgba(0, 0, 0, 0.42)";
        ctx.beginPath();
        this.drawEllipse(ctx, 0, 24, 30, 9);
        ctx.fill();

        ctx.fillStyle = "#d7c29a";
        ctx.strokeStyle = item.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        this.drawRoundRect(ctx, -24, -28, 48, 54, 5);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "rgba(16, 19, 23, 0.18)";
        ctx.fillRect(-15, -14, 30, 4);
        ctx.fillRect(-15, -5, 24, 4);
        ctx.fillRect(-15, 4, 30, 4);
        ctx.fillStyle = "#101317";
        ctx.font = "900 12px ui-sans-serif, system-ui";
        ctx.fillText(item.playerLabel ?? "BP", 0, 20);
        ctx.restore();
        continue;
      }

      if (item.type === "material") {
        ctx.save();
        ctx.translate(item.x, item.y + bob);
        ctx.fillStyle = "rgba(0, 0, 0, 0.42)";
        ctx.beginPath();
        this.drawEllipse(ctx, 0, 21, 24, 8);
        ctx.fill();

        ctx.fillStyle = item.color;
        ctx.strokeStyle = "#101317";
        ctx.lineWidth = 3;
        ctx.beginPath();
        if (item.material === "weaponCore") {
          ctx.moveTo(0, -28);
          ctx.lineTo(22, -7);
          ctx.lineTo(11, 23);
          ctx.lineTo(-11, 23);
          ctx.lineTo(-22, -7);
        } else {
          ctx.moveTo(0, -24);
          ctx.lineTo(18, -5);
          ctx.lineTo(8, 22);
          ctx.lineTo(-15, 15);
          ctx.lineTo(-18, -8);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        if (item.amount > 1) {
          ctx.fillStyle = "#101317";
          ctx.font = "900 12px ui-sans-serif, system-ui";
          ctx.fillText(`x${item.amount}`, 0, 6);
        }
        ctx.restore();
        continue;
      }

      if (item.type === "goldBar") {
        ctx.save();
        ctx.translate(item.x, item.y + bob);
        ctx.rotate(-0.22);
        ctx.fillStyle = "rgba(0, 0, 0, 0.42)";
        ctx.beginPath();
        this.drawEllipse(ctx, 0, 23, 28, 8);
        ctx.fill();

        ctx.fillStyle = item.color;
        ctx.strokeStyle = "#101317";
        ctx.lineWidth = 3;
        ctx.beginPath();
        this.drawRoundRect(ctx, -26, -12, 52, 24, 5);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "rgba(246, 241, 232, 0.38)";
        ctx.fillRect(-17, -6, 34, 4);
        ctx.restore();
        continue;
      }

      if (item.type === "shop") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.42)";
        ctx.beginPath();
        this.drawEllipse(ctx, item.x, item.y + 24, 42, 11);
        ctx.fill();

        ctx.fillStyle = "#8d5a38";
        ctx.beginPath();
        this.drawRoundRect(ctx, item.x - 38, item.y - 6 + bob, 76, 40, 6);
        ctx.fill();
        ctx.strokeStyle = item.color;
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = item.color;
        ctx.beginPath();
        ctx.moveTo(item.x - 44, item.y - 6 + bob);
        ctx.lineTo(item.x - 28, item.y - 34 + bob);
        ctx.lineTo(item.x + 28, item.y - 34 + bob);
        ctx.lineTo(item.x + 44, item.y - 6 + bob);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#101317";
        ctx.font = "900 17px ui-sans-serif, system-ui";
        ctx.fillText("$", item.x, item.y + 19 + bob);
        continue;
      }

      if (item.type === "sage") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.42)";
        ctx.beginPath();
        this.drawEllipse(ctx, item.x, item.y + 22, 30, 9);
        ctx.fill();
        ctx.fillStyle = item.color;
        ctx.beginPath();
        ctx.arc(item.x, item.y - 10 + bob, 22, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#5ec28c";
        ctx.beginPath();
        ctx.moveTo(item.x - 26, item.y + 26 + bob);
        ctx.lineTo(item.x, item.y - 8 + bob);
        ctx.lineTo(item.x + 26, item.y + 26 + bob);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#101317";
        ctx.font = "900 18px ui-sans-serif, system-ui";
        ctx.fillText("?", item.x, item.y - 3 + bob);
        continue;
      }

      if (item.type === "chest") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.42)";
        ctx.beginPath();
        this.drawEllipse(ctx, item.x, item.y + 22, 34, 10);
        ctx.fill();

        ctx.fillStyle = item.opened ? "#6d6258" : item.color;
        ctx.strokeStyle = item.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        this.drawRoundRect(ctx, item.x - 32, item.y - 18 + bob, 64, 38, 6);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
        ctx.fillRect(item.x - 26, item.y - 2 + bob, 52, 5);
        ctx.fillStyle = item.rarity === "legendary" ? "#f6f1e8" : "#f2b85b";
        ctx.fillRect(item.x - 6, item.y - 8 + bob, 12, 14);
        ctx.fillStyle = "#101317";
        ctx.font = "900 12px ui-sans-serif, system-ui";
        ctx.fillText((item.rarity ?? "common")[0].toUpperCase(), item.x, item.y + 12 + bob);
      }
    }
  }

  drawLobbyCharacter(ctx, item, bob) {
    ctx.save();
    ctx.translate(item.x, item.y + bob);

    ctx.fillStyle = "rgba(0, 0, 0, 0.38)";
    ctx.beginPath();
    this.drawEllipse(ctx, 0, 28, 42, 12);
    ctx.fill();

    ctx.fillStyle = "rgba(255, 255, 255, 0.05)";
    ctx.strokeStyle = item.accent;
    ctx.lineWidth = 3;
    ctx.beginPath();
    this.drawRoundRect(ctx, -54, -14, 108, 74, 8);
    ctx.fill();
    ctx.stroke();

    if (!this.drawLobbyCharacterSprite(ctx, item)) {
      ctx.fillStyle = item.color;
      ctx.beginPath();
      ctx.arc(0, -20, 24, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#101317";
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.fillStyle = item.accent;
      if (item.characterId === "swordsman") {
        ctx.save();
        ctx.rotate(-0.58);
        ctx.fillRect(24, -4, 62, 8);
        ctx.fillRect(78, -11, 15, 22);
        ctx.restore();
      } else {
        ctx.strokeStyle = item.accent;
        ctx.lineWidth = 6;
        ctx.beginPath();
        this.drawEllipse(ctx, 30, -18, 24, 36, 0, -Math.PI / 2, Math.PI / 2);
        ctx.stroke();
        ctx.fillRect(14, -21, 70, 6);
      }
    }

    ctx.fillStyle = "#f6f1e8";
    ctx.font = "900 13px ui-sans-serif, system-ui";
    ctx.fillText(item.role, 0, 80);
    ctx.restore();
  }

  drawLobbyCharacterSprite(ctx, item) {
    const sheet = this.sprites[item.characterId];
    if (!sheet?.loaded) {
      return false;
    }

    const animation = sheet.animations.idle;
    const frame = Math.floor(performance.now() / 1000 * animation.fps) % animation.frames;
    const sourceX = frame * sheet.frameWidth;
    const sourceY = animation.row * sheet.frameHeight;
    const width = Math.round(sheet.drawWidth * 0.95);
    const height = Math.round(sheet.drawHeight * 0.95);
    ctx.drawImage(sheet.image, sourceX, sourceY, sheet.frameWidth, sheet.frameHeight, -width / 2, -height / 2 - 16, width, height);
    return true;
  }

  drawLobbyPortal(ctx, item, bob) {
    ctx.save();
    ctx.translate(item.x, item.y + bob);

    ctx.fillStyle = "rgba(0, 0, 0, 0.42)";
    ctx.beginPath();
    this.drawEllipse(ctx, 0, 46, 68, 17);
    ctx.fill();

    ctx.strokeStyle = item.color;
    ctx.lineWidth = 8;
    ctx.beginPath();
    this.drawEllipse(ctx, 0, 0, 42, 60);
    ctx.stroke();
    ctx.globalAlpha = 0.42;
    ctx.fillStyle = item.color;
    ctx.beginPath();
    this.drawEllipse(ctx, 0, 0, 28, 45);
    ctx.fill();
    ctx.globalAlpha = 0.85;
    ctx.rotate(performance.now() / 720);
    ctx.strokeStyle = "#f6f1e8";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, Math.PI * 1.35);
    ctx.stroke();
    ctx.restore();
  }

  drawLobbySpot(ctx, item, bob) {
    ctx.save();
    ctx.translate(item.x, item.y + bob);

    ctx.fillStyle = "rgba(0, 0, 0, 0.34)";
    ctx.beginPath();
    this.drawEllipse(ctx, 0, 24, 42, 10);
    ctx.fill();

    ctx.fillStyle = "rgba(255, 255, 255, 0.06)";
    ctx.strokeStyle = item.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    this.drawRoundRect(ctx, -44, -20, 88, 46, 7);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = item.color;
    ctx.beginPath();
    ctx.arc(0, -32, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(-3, -22, 6, 23);

    ctx.fillStyle = "#afa89e";
    ctx.font = "800 12px ui-sans-serif, system-ui";
    ctx.fillText(item.name, 0, 52);
    ctx.restore();
  }

  drawQuestTorches(ctx, stage) {
    if (!stage.isQuest || !stage.quest?.torches) {
      return;
    }

    for (const torch of stage.quest.torches) {
      ctx.save();
      ctx.globalAlpha = 0.65 + Math.sin(performance.now() / 180 + torch.x) * 0.15;
      ctx.fillStyle = "rgba(242, 184, 91, 0.18)";
      ctx.beginPath();
      ctx.arc(torch.x, torch.y, stage.quest.cellSize * 1.75, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#f2b85b";
      ctx.beginPath();
      ctx.arc(torch.x, torch.y, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  drawQuestFog(ctx, game) {
    const stage = game.stage;
    const quest = stage.quest;
    if (!stage.isQuest || !quest) {
      return;
    }

    const players = game.alivePlayers().length > 0 ? game.alivePlayers() : game.players;
    const playerCells = players.map((player) => ({
      col: Math.floor((player.x - stage.room.margin) / quest.cellSize),
      row: Math.floor((player.y - stage.room.margin) / quest.cellSize)
    }));

    ctx.save();
    ctx.fillStyle = "rgba(0, 0, 0, 0.9)";
    for (let row = 0; row < quest.rows; row += 1) {
      for (let col = 0; col < quest.cols; col += 1) {
        if (this.questCellVisible(quest, col, row, playerCells)) {
          continue;
        }
        ctx.fillRect(
          stage.room.margin + col * quest.cellSize,
          stage.room.margin + row * quest.cellSize,
          quest.cellSize + 1,
          quest.cellSize + 1
        );
      }
    }
    ctx.restore();
  }

  questCellVisible(quest, col, row, playerCells) {
    const playerVisible = playerCells.some((cell) => Math.hypot(cell.col - col, cell.row - row) < 1.85);
    if (playerVisible) {
      return true;
    }
    return quest.torches.some((torch) => Math.hypot(torch.col - col, torch.row - row) < 2.15);
  }

  drawFloaters(ctx, floaters) {
    ctx.font = "700 18px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    for (const floater of floaters) {
      ctx.globalAlpha = Math.max(0, floater.life / floater.total);
      ctx.fillStyle = floater.color;
      ctx.fillText(floater.text, floater.x, floater.y);
    }
    ctx.globalAlpha = 1;
  }

  drawSpeechBubbles(ctx, bubbles) {
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "800 15px ui-sans-serif, system-ui";

    for (const bubble of bubbles) {
      const target = bubble.target ?? bubble;
      const x = target.x ?? bubble.x;
      const y = (target.y ?? bubble.y) + bubble.offsetY;
      const lines = this.wrapText(ctx, bubble.text, 210);
      const width = Math.min(238, Math.max(92, ...lines.map((line) => ctx.measureText(line).width + 30)));
      const height = 28 + lines.length * 18;
      const alpha = Math.min(1, bubble.life / 0.22, bubble.life / bubble.total);

      ctx.globalAlpha = alpha;
      ctx.fillStyle = "rgba(10, 12, 15, 0.88)";
      ctx.strokeStyle = bubble.accent;
      ctx.lineWidth = 3;
      ctx.beginPath();
      this.drawRoundRect(ctx, x - width / 2, y - height / 2, width, height, 8);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x - 8, y + height / 2 - 1);
      ctx.lineTo(x, y + height / 2 + 12);
      ctx.lineTo(x + 10, y + height / 2 - 1);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = bubble.color;
      lines.forEach((line, index) => {
        const lineY = y - (lines.length - 1) * 9 + index * 18;
        ctx.fillText(line, x, lineY);
      });
    }

    ctx.restore();
    ctx.globalAlpha = 1;
  }

  wrapText(ctx, text, maxWidth) {
    const words = text.split(" ");
    const lines = [];
    let line = "";

    for (const word of words) {
      const testLine = line ? `${line} ${word}` : word;
      if (ctx.measureText(testLine).width > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = testLine;
      }
    }

    if (line) {
      lines.push(line);
    }
    return lines;
  }

  drawHud(ctx, game) {
    const scale = this.dpr;

    ctx.save();
    ctx.scale(scale, scale);
    const width = this.canvas.width / scale;
    const height = this.canvas.height / scale;

    ctx.fillStyle = "rgba(10, 12, 15, 0.68)";
    ctx.fillRect(14, 12, 292, 30);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
    ctx.strokeRect(14, 12, 292, 30);
    ctx.fillStyle = "#f6f1e8";
    ctx.font = "800 13px ui-sans-serif, system-ui";
    ctx.fillText(game.stage.isLobby ? `Lobby: ${game.stage.name}` : `Stage ${game.stage.number}: ${game.stage.name}`, 24, 32);
    ctx.fillStyle = "#afa89e";
    if (game.stage.isLobby) {
      const classCount = game.loot.filter((item) => item.type === "lobbyCharacter").length;
      const quietCount = game.loot.filter((item) => item.type === "lobbySpot").length;
      ctx.fillText(`Classes ${classCount}  Quiet spots ${quietCount}  Gate ready`, 24, 58);
    } else {
      const chestReady = game.loot.some((item) => item.type === "chest") ? "ready" : "none";
      const shopReady = game.loot.some((item) => item.type === "shop") ? "open" : "none";
      ctx.fillText(`Enemies ${game.enemies.length}  Chest ${chestReady}  Shop ${shopReady}`, 24, 58);
    }

    game.players.forEach((player, index) => {
      this.drawPlayerHud(ctx, player, 16, 72 + index * 72);
      if (width > 680) {
        this.drawAbilityButton(ctx, player, width - 154, 30 + index * 74, "ultimate");
        this.drawAbilityButton(ctx, player, width - 78, 30 + index * 74, "extra");
      }
    });

    if (width > 680) {
      ctx.fillStyle = "rgba(10, 12, 15, 0.58)";
      ctx.fillRect(width - 380, height - 42, 366, 28);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
      ctx.strokeRect(width - 380, height - 42, 366, 28);
      ctx.fillStyle = "#afa89e";
      ctx.font = "700 12px ui-sans-serif, system-ui";
      ctx.fillText("Auto-aim only: P1 R/Q/E/F   P2 / . , Enter", width - 368, height - 24);
    }

    if (game.nearbyInteractable) {
      const item = game.nearbyInteractable;
      const label = this.interactLabel(item);
      const statLine = item.type === "chest"
        ? `${item.name}: choose one of three rewards`
        : item.type === "shop"
          ? item.stock ? `${item.name}: ${item.stock.length} offers remaining` : `${item.name}: paid stock available`
          : item.type === "blueprint"
            ? item.description
            : item.type === "material"
              ? `${item.playerLabel ?? "Player"} pickup: ${item.amount > 1 ? `${item.amount} ` : ""}${item.name}`
            : "";
      const boxWidth = Math.min(width - 28, Math.max(width <= 680 ? 280 : 360, Math.max(label.length, statLine.length) * 7.4));
      const x = this.canvas.width / scale / 2 - boxWidth / 2;
      const boxHeight = statLine ? 62 : 42;
      const y = this.canvas.height / scale - (width <= 680 ? 188 : statLine ? 112 : 88);
      ctx.fillStyle = "rgba(10, 12, 15, 0.82)";
      ctx.fillRect(x, y, boxWidth, boxHeight);
      ctx.strokeStyle = item.color;
      ctx.strokeRect(x, y, boxWidth, boxHeight);
      ctx.fillStyle = "#f6f1e8";
      ctx.font = "800 14px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText(label, this.canvas.width / scale / 2, y + 27);
      if (statLine) {
        ctx.fillStyle = "#afa89e";
        ctx.font = "700 13px ui-sans-serif, system-ui";
        ctx.fillText(statLine, this.canvas.width / scale / 2, y + 47);
      }
      ctx.textAlign = "start";
    }
    ctx.restore();
  }

  drawPlayerHud(ctx, player, x, y) {
    const compact = this.canvas.width <= 680;
    const panelW = compact ? Math.min(246, this.canvas.width - 32) : 276;
    const hpW = compact ? 108 : 128;
    ctx.fillStyle = "rgba(10, 12, 15, 0.68)";
    ctx.fillRect(x, y, panelW, 62);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
    ctx.strokeRect(x, y, panelW, 62);
    ctx.fillStyle = player.playerIndex === 1 ? "#73a9ff" : "#f2b85b";
    ctx.font = "900 12px ui-sans-serif, system-ui";
    const roleLabel = player.canMannequinTransform ? `${player.character.role} Form` : player.character.role;
    ctx.fillText(`${player.label} ${roleLabel}`, x + 10, y + 17);
    ctx.fillStyle = "rgba(255, 255, 255, 0.18)";
    ctx.fillRect(x + 10, y + 24, hpW, 8);
    ctx.fillStyle = player.hp > 0 ? "#d95757" : "#6d6258";
    ctx.fillRect(x + 10, y + 24, hpW * Math.max(0, player.hp / player.maxHp), 8);
    ctx.fillStyle = "#afa89e";
    ctx.font = "700 11px ui-sans-serif, system-ui";
    const weaponLine = compact ? player.weapon.name : `${player.weapon.name}  ${weaponStats(player.weapon, player)}`;
    ctx.fillText(this.fitText(ctx, weaponLine, panelW - 20), x + 10, y + 43);
    ctx.fillStyle = "#f2b85b";
    ctx.font = "800 11px ui-sans-serif, system-ui";
    const resourceLine = player.blueprints.weaponEvolution && !player.weaponEvolution.completed
      ? `Weapon BP ${weaponUpgradeRequirementLine(player)}`
      : `Coins ${player.gold}  Ore ${player.materials.weapon}  Core ${player.materials.weaponCore}  Sigils ${player.materials.hero}`;
    ctx.fillText(this.fitText(ctx, resourceLine, panelW - 20), x + 10, y + 57);
  }

  fitText(ctx, text, maxWidth) {
    if (ctx.measureText(text).width <= maxWidth) {
      return text;
    }
    let clipped = text;
    while (clipped.length > 0 && ctx.measureText(`${clipped}...`).width > maxWidth) {
      clipped = clipped.slice(0, -1);
    }
    return clipped ? `${clipped}...` : "";
  }

  drawAbilityButton(ctx, player, x, y, kind) {
    const isUltimate = kind === "ultimate";
    const radius = 27;
    const cooldown = isUltimate ? player.abilityCooldownValue() : player.extraAbilityCooldown;
    const maxCooldown = isUltimate ? player.abilityCooldownMax() : player.extraAbilityCooldownMax();
    const isTransformButton = !isUltimate && player.canMannequinTransform;
    const hasSlot = isTransformButton || (isUltimate ? Boolean(player.ability) : Boolean(player.extraAbilityId));
    const ready = hasSlot && (isTransformButton || cooldown <= 0);
    const progress = isTransformButton ? 1 : hasSlot ? (ready ? 1 : 1 - cooldown / Math.max(0.01, maxCooldown)) : 0;
    const color = isUltimate ? player.character.accent : player.playerIndex === 1 ? "#73a9ff" : "#f2b85b";

    ctx.save();
    ctx.fillStyle = "rgba(10, 12, 15, 0.82)";
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255, 255, 255, 0.16)";
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.strokeStyle = ready ? color : "rgba(255, 255, 255, 0.28)";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(x, y, radius - 2, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0, Math.min(1, progress)));
    ctx.stroke();

    this.drawAbilityIcon(ctx, player, x, y, kind, color);
    if (!ready) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.52)";
      ctx.beginPath();
      ctx.arc(x, y, radius - 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#f6f1e8";
      ctx.font = "900 12px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText(hasSlot && cooldown > 0 ? Math.ceil(cooldown).toString() : "LOCK", x, y + 4);
    }
    if (player.transformEntry?.active && isTransformButton) {
      ctx.fillStyle = "#f6f1e8";
      ctx.font = "900 10px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText(player.transformEntry.buffer || "...", x, y + 4);
    }
    ctx.fillStyle = "#afa89e";
    ctx.font = "800 10px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.fillText(isUltimate ? "ULT" : isTransformButton ? "FORM" : "EVO", x, y + 42);
    ctx.restore();
  }

  drawAbilityIcon(ctx, player, x, y, kind, color) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    ctx.translate(x, y);
    if (kind === "extra" && player.canMannequinTransform) {
      ctx.beginPath();
      ctx.arc(0, 0, 13, Math.PI * 0.15, Math.PI * 1.85);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(11, -10);
      ctx.lineTo(17, -13);
      ctx.lineTo(14, -5);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.fill();
    } else if ((kind === "ultimate" && !player.ability) || (kind === "extra" && !player.extraAbilityId)) {
      ctx.globalAlpha = 0.7;
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-10, 10);
      ctx.lineTo(10, -10);
      ctx.stroke();
    } else if (kind === "extra" && player.extraAbilityId === "arrowStorm") {
      ctx.beginPath();
      ctx.arc(0, 2, 13, 0.2, Math.PI * 1.8);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-10, -8);
      ctx.lineTo(10, 12);
      ctx.moveTo(10, -8);
      ctx.lineTo(-10, 12);
      ctx.stroke();
    } else if (kind === "extra" && player.extraAbilityId === "guardBreaker") {
      ctx.beginPath();
      ctx.moveTo(-15, 10);
      ctx.lineTo(14, -10);
      ctx.lineTo(8, -12);
      ctx.moveTo(14, -10);
      ctx.lineTo(14, -3);
      ctx.stroke();
    } else if (player.character.classId === "archer") {
      ctx.beginPath();
      ctx.arc(-2, 0, 14, -Math.PI / 2, Math.PI / 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-14, 0);
      ctx.lineTo(15, 0);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, 13, 0.2, Math.PI * 1.65);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(9, -10);
      ctx.lineTo(16, -13);
      ctx.lineTo(13, -5);
      ctx.fill();
    }
    ctx.restore();
  }

  drawRewardChoices(ctx, game) {
    if (!game.rewardChoices) {
      return;
    }

    ctx.save();
    ctx.fillStyle = "rgba(5, 7, 10, 0.72)";
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

    ctx.fillStyle = "#f6f1e8";
    const compact = this.canvas.width < 680;
    ctx.font = compact ? "900 21px ui-sans-serif, system-ui" : "900 28px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    const source = game.rewardChest;
    const isShop = source?.type === "shop";
    ctx.fillText(isShop ? "Choose One Shop Offer" : "Choose One Reward", this.canvas.width / 2, compact ? 52 : this.canvas.height / 2 - 112);
    ctx.fillStyle = "#afa89e";
    ctx.font = compact ? "700 12px ui-sans-serif, system-ui" : "700 14px ui-sans-serif, system-ui";
    const pickerLabel = game.rewardPicker ? `${game.rewardPicker.label} ${isShop ? "shop" : "reward"}` : isShop ? "Shop" : "Reward";
    const chestLabel = source ? (isShop ? `${pickerLabel}: ${source.name} offers are active` : `${pickerLabel}: ${source.name} odds are active`) : "Click a reward or press 1, 2, or 3";
    ctx.fillText(this.fitText(ctx, chestLabel, this.canvas.width - 36), this.canvas.width / 2, compact ? 76 : this.canvas.height / 2 - 84);
    if (source) {
      ctx.fillStyle = source.color;
      ctx.font = compact ? "800 12px ui-sans-serif, system-ui" : "800 13px ui-sans-serif, system-ui";
      const prompt = compact
        ? isShop ? "Tap an offer, or USE to leave" : "Tap a reward"
        : isShop ? "Click an offer, press 1-3, or press interact/Esc to leave" : "Click a reward or press 1, 2, or 3";
      ctx.fillText(prompt, this.canvas.width / 2, compact ? 96 : this.canvas.height / 2 - 64);
    }

    const boxes = game.rewardChoiceBoxes();
    game.rewardChoices.forEach((reward, index) => {
      const box = boxes[index];
      const color = rewardColors[reward.rarity] ?? "#f6f1e8";
      ctx.fillStyle = "rgba(18, 22, 27, 0.96)";
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      this.drawRoundRect(ctx, box.x, box.y, box.w, box.h, 8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = color;
      ctx.font = compact ? "900 12px ui-sans-serif, system-ui" : "900 13px ui-sans-serif, system-ui";
      ctx.fillText(`${index + 1}  ${reward.type.toUpperCase()}`, box.x + box.w / 2, box.y + (compact ? 22 : 28));

      if (isShop && reward.cost) {
        const canAfford = (game.rewardPicker?.gold ?? 0) >= reward.cost;
        ctx.fillStyle = canAfford ? "#f2b85b" : "#d95757";
        ctx.font = compact ? "900 12px ui-sans-serif, system-ui" : "900 13px ui-sans-serif, system-ui";
        ctx.fillText(`${reward.cost} coins`, box.x + box.w / 2, box.y + (compact ? 40 : 48));
      }

      ctx.fillStyle = "#f6f1e8";
      ctx.font = compact ? "900 16px ui-sans-serif, system-ui" : "900 20px ui-sans-serif, system-ui";
      this.wrapText(ctx, reward.name, box.w - 34).forEach((line, lineIndex) => {
        ctx.fillText(line, box.x + box.w / 2, box.y + (compact ? isShop ? 60 : 46 : isShop ? 78 : 62) + lineIndex * (compact ? 18 : 22));
      });

      ctx.fillStyle = "#afa89e";
      ctx.font = compact ? "700 12px ui-sans-serif, system-ui" : "700 14px ui-sans-serif, system-ui";
      this.wrapText(ctx, reward.description, box.w - 32).slice(0, compact ? 2 : 3).forEach((line, lineIndex) => {
        ctx.fillText(line, box.x + box.w / 2, box.y + (compact ? isShop ? 94 : 82 : isShop ? 122 : 110) + lineIndex * (compact ? 15 : 18));
      });
    });

    ctx.restore();
  }

  interactLabel(item) {
    const prefix = item.playerLabel ? `${item.playerLabel}: ` : "";
    if (item.type === "portal") {
      return `${prefix}Press interact to enter the next room`;
    }
    if (item.type === "questPortal") {
      return `${prefix}Press interact to enter the hidden quest`;
    }
    if (item.type === "lobbyCharacter") {
      return `${prefix}Press interact to become ${item.name}`;
    }
    if (item.type === "lobbyPortal") {
      return `${prefix}Press interact to enter the dungeon`;
    }
    if (item.type === "lobbySpot") {
      return `${prefix}Press interact to inspect ${item.name}`;
    }
    if (item.type === "healthPotion") {
      return `${prefix}Press interact to drink health pot (+${item.healAmount} HP)`;
    }
    if (item.type === "shop") {
      return `${prefix}Press interact to browse ${item.name ?? "shop"} stock`;
    }
    if (item.type === "blueprint") {
      return `${prefix}Press interact to claim ${item.name ?? "weapon blueprint"}`;
    }
    if (item.type === "material") {
      return `${prefix}Press interact to pick up ${item.name ?? "material"}`;
    }
    if (item.type === "goldBar") {
      return `${prefix}Press interact to throw Gold Bar`;
    }
    if (item.type === "sage") {
      return `${prefix}Press interact to deliver the message`;
    }
    return `${prefix}Press interact to open ${item.name ?? "reward chest"}`;
  }
}



// src/input.js

class InputManager {
  constructor(canvas) {
    this.canvas = canvas;
    this.keys = new Set();
    this.pressed = new Set();
    this.virtualDown = new Set();
    this.virtualPressed = new Set();
    this.virtualAxes = { x: 0, y: 0 };
    this.mouse = { x: 0, y: 0, down: false, pressed: false };
    this.keybinds = loadKeybinds();
    this.secretBuffer = "";
    this.typedCharacters = [];

    window.addEventListener("keydown", (event) => {
      const editable = isEditableTarget(event.target);
      if (!this.keys.has(event.code)) {
        this.pressed.add(event.code);
      }
      this.keys.add(event.code);

      if (!editable && !event.repeat && !event.metaKey && !event.ctrlKey && !event.altKey && event.key.length === 1) {
        const typed = event.key.toLowerCase();
        this.secretBuffer = `${this.secretBuffer}${typed}`.slice(-32);
        this.typedCharacters.push(typed);
      } else if (!editable && !event.repeat && event.code === "Backspace") {
        this.typedCharacters.push("backspace");
      }

      if (!editable && Object.values(this.keybinds).includes(event.code)) {
        event.preventDefault();
      }
    }, true);

    window.addEventListener("keyup", (event) => {
      this.keys.delete(event.code);
    });

    canvas.addEventListener("pointermove", (event) => {
      this.updatePointerPosition(event);
    });

    canvas.addEventListener("mousemove", (event) => {
      this.updatePointerPosition(event);
    });

    canvas.addEventListener("pointerdown", (event) => {
      this.updatePointerPosition(event);
      this.mouse.down = true;
      this.mouse.pressed = true;
    });

    canvas.addEventListener("mousedown", (event) => {
      this.updatePointerPosition(event);
      this.mouse.down = true;
      this.mouse.pressed = true;
    });

    window.addEventListener("pointerup", () => {
      this.mouse.down = false;
    });

    window.addEventListener("mouseup", () => {
      this.mouse.down = false;
    });
  }

  updatePointerPosition(event) {
    const rect = this.canvas.getBoundingClientRect();
    this.mouse.x = (event.clientX - rect.left) * (this.canvas.width / rect.width);
